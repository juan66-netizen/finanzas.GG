<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/negro-180.png">
<link rel="icon" type="image/png" href="icons/negro-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1633">
<meta name="format-detection" content="telephone=no">
<script>
  // Aplica el tema guardado antes de pintar (evita un destello del tema por defecto)
  try { var p = JSON.parse(localStorage.getItem('mis-finanzas-prefs')); if (p && p.theme) document.documentElement.dataset.theme = p.theme; } catch (e) {}
</script>
<style>
/* Temas: cada uno redefine la paleta. Los colores de datos (ingresos, gastos,
   fijos, saldo) están validados contra la superficie de cada tema (contraste
   >= 4:1 y separación para daltonismo). */
:root {
  color-scheme: dark;
  --bg: #0b1633;          /* azul marino (tema por defecto) */
  --surface: #14234a;     /* tarjetas */
  --surface-2: #1c2f5e;   /* campos y elementos elevados */
  --border: rgba(255,255,255,0.10);
  --text: #ffffff;
  --text-2: #c9d3ea;
  --muted: #8e9cc0;
  --grid: #22366a;
  --axis: #34497d;
  --hero-a: #1d3a7a;
  --hero-b: #14234a;
  --tabbar: #0a1430;
  --backdrop: rgba(2,6,20,.6);
  --soft: rgba(255,255,255,0.06);
  --income: #14a88a;
  --expense: #e5683c;
  --fixed: #9085e9;
  --net: #8cc8ff;
  --acc-card: #3d8fe8;   /* tarjeta y efectivo: validados juntos en los 7 temas */
  --acc-cash: #c95fb0;
  --good-text: #5ee0a0;
  --bad-text: #ff8f8f;
  --warning: #fab219;
  --link: #8cc8ff;
  --toast-link: #1d5fd6;
  --accent-auto: #ffffff;
  --accent-ink-auto: #0b1633;
  --accent: var(--accent-auto);
  --accent-ink: var(--accent-ink-auto);
  --tab-on: var(--text);
  --tabbar-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="negro"] {
  --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --border: rgba(255,255,255,0.08);
  --text-2: #d1d1d6; --muted: #98989f; --grid: #2c2c2e; --axis: #3a3a3c;
  --hero-a: #2c2c30; --hero-b: #1c1c1e; --tabbar: #0a0a0a; --backdrop: rgba(0,0,0,.65);
  --accent-ink-auto: #000000;
}
:root[data-theme="grafito"] {
  --bg: #15171b; --surface: #23262d; --surface-2: #2f333c; --border: rgba(255,255,255,0.09);
  --text-2: #d3d6dd; --muted: #9a9fab; --grid: #30343d; --axis: #444955;
  --hero-a: #363c48; --hero-b: #23262d; --tabbar: #121418; --backdrop: rgba(5,6,8,.6);
  --accent-ink-auto: #15171b;
}
:root[data-theme="bosque"] {
  --bg: #0a1d18; --surface: #12302a; --surface-2: #1a3f37; --border: rgba(255,255,255,0.10);
  --text-2: #cfe5dd; --muted: #93b9ad; --grid: #1d4a40; --axis: #2b5e52;
  --hero-a: #1d5a4b; --hero-b: #12302a; --tabbar: #081814; --backdrop: rgba(2,10,8,.6);
  --accent-ink-auto: #0a1d18;
}
:root[data-theme="morado"] {
  --bg: #120d29; --surface: #221a47; --surface-2: #2e245c; --border: rgba(255,255,255,0.10);
  --text-2: #d8d2f2; --muted: #a49bcd; --grid: #2f2763; --axis: #463b85;
  --hero-a: #3b2c7a; --hero-b: #221a47; --tabbar: #0f0b23; --backdrop: rgba(6,3,16,.6);
  --accent-ink-auto: #120d29;
}
:root[data-theme="vino"] {
  --bg: #1f0a12; --surface: #3a1622; --surface-2: #4a1f2d; --border: rgba(255,255,255,0.10);
  --text-2: #f0d3da; --muted: #c497a2; --grid: #4f2231; --axis: #6a3344;
  --hero-a: #5e2236; --hero-b: #3a1622; --tabbar: #1a080f; --backdrop: rgba(10,2,5,.6);
  --accent-ink-auto: #1f0a12;
}
:root[data-theme="claro"] {
  color-scheme: light;
  --bg: #f2f2f7; --surface: #ffffff; --surface-2: #ececf1; --border: rgba(0,0,0,0.08);
  --text: #0b0b0b; --text-2: #3c3c43; --muted: #6b6b73; --grid: #e5e5ea; --axis: #c7c7cc;
  --hero-a: #dfe9ff; --hero-b: #ffffff; --tabbar: #f7f7fa; --backdrop: rgba(0,0,0,.35);
  --soft: rgba(0,0,0,0.04);
  --income: #0f8a72; --expense: #d4572a; --fixed: #6b5fd3; --net: #2a78d6; --acc-card: #2468c9; --acc-cash: #a8327a;
  --good-text: #0a7a3a; --bad-text: #c62828; --link: #0a64d6; --toast-link: #8cc8ff;
  --accent-auto: #0b1633; --accent-ink-auto: #ffffff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.pos { color: var(--good-text); }
.neg { color: var(--bad-text); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Estructura ---------- */
.app { max-width: 640px; margin: 0 auto; min-height: 100vh; }
header.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
header.top h1 { margin: 0; font-size: 28px; font-weight: 750; letter-spacing: -0.02em; }
.month-switch { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.month-switch button { background: none; border: 0; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; color: var(--text-2); }
.month-switch button:active { background: var(--surface-2); }
.month-switch span { font-size: 14px; font-weight: 600; min-width: 112px; text-align: center; }
.month-switch span::first-letter { text-transform: uppercase; }
main {
  padding: 4px max(16px, env(safe-area-inset-right)) calc(var(--tabbar-h) + var(--safe-b) + 96px) max(16px, env(safe-area-inset-left));
}
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 15px; font-weight: 650; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 .link { font-size: 14px; font-weight: 500; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

/* ---------- Hero ---------- */
.hero { background: linear-gradient(160deg, var(--hero-a) 0%, var(--hero-b) 70%); }
.hero .label { color: var(--text-2); font-size: 14px; }
.hero .big { font-size: 38px; font-weight: 750; letter-spacing: -0.02em; margin: 2px 0 14px; overflow-wrap: anywhere; }
.hero .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hero .split > div { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.hero .k { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.hero .v { font-size: 19px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
.hero .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.hero .foot { margin-top: 12px; font-size: 13px; color: var(--text-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.hero .avail { margin-top: 12px; width: 100%; display: flex; flex-direction: column; gap: 6px; background: var(--soft); border: 0; border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--text-2); text-align: left; }
.hero .avail .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero .avail .top b { font-size: 17px; color: var(--text); white-space: nowrap; }
.hero .avail .accs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.hero .avail .accs b { color: var(--text); font-weight: 650; }
.hero .avail b.neg { color: var(--bad-text); }
/* Selector de cuenta y cuentas */
.acc-seg button { display: flex; align-items: center; justify-content: center; gap: 6px; }
.flow { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.flow .end { flex: 1; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; text-align: center; font-weight: 650; font-size: 15px; }
.flow .end small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
.flow .swap { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 18px; flex: none; }
.acc-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acc-tile { background: var(--surface-2); border-radius: 14px; padding: 12px; min-width: 0; }
.acc-tile .h { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.acc-tile .bal { font-size: 21px; font-weight: 750; margin-top: 4px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.acc-tile .mv { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.xfer { color: var(--text-2) !important; }
.o-acc { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
.o-acc .h { font-weight: 650; font-size: 15px; white-space: nowrap; }
.o-in { display: flex; align-items: center; gap: 6px; min-width: 0; }
.o-in .inp { width: 120px; text-align: right; font-size: 20px; font-weight: 700; background: var(--surface); min-height: 44px; }
.o-in .sign { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 800; font-size: 17px; flex: none; }
.o-in .sign.neg { color: var(--bad-text); border-color: var(--bad-text); }
.o-in .cur { color: var(--muted); font-weight: 600; }
.opening-row { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; text-align: left; color: var(--text); }
.opening-row .e { font-size: 22px; }
.opening-row .m { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 15px; }
.opening-row .m span { font-size: 13px; color: var(--muted); }
.opening-row .go { color: var(--link); font-size: 15px; font-weight: 600; white-space: nowrap; }

/* ---------- Barras de categoría ---------- */
.cat { display: grid; grid-template-columns: 30px 1fr; gap: 2px 10px; align-items: center; margin-bottom: 14px; }
.cat:last-child { margin-bottom: 0; }
.cat .ico { grid-row: span 2; font-size: 20px; text-align: center; }
.cat .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.cat .top b { font-weight: 600; }
.track { position: relative; height: 10px; background: var(--grid); border-radius: 4px; margin-top: 4px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--expense); }
.fill.goal { background: var(--income); }
.budget-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); border-radius: 1px; }
.cat .meta { grid-column: 2; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; margin-top: 3px; }
.cat .meta span { white-space: nowrap; }
.over { color: var(--bad-text); font-weight: 600; }

/* ---------- Gráfico ---------- */
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); margin: -4px 0 6px; }
.legend span { display: flex; align-items: center; gap: 6px; }
svg.chart { width: 100%; height: auto; display: block; touch-action: manipulation; }
svg.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg.chart .gridline { stroke: var(--grid); }
svg.chart .baseline { stroke: var(--axis); }
svg.chart .hit { fill: transparent; }
svg.chart .hit:hover, svg.chart .hit.on { fill: var(--text); fill-opacity: .06; }

/* ---------- Listas ---------- */
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; margin-bottom: 12px; }
.list-h { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 4px 6px; display: flex; justify-content: space-between; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; background: none; border: 0; text-align: left; min-height: 60px; }
.item + .item { border-top: 1px solid var(--border); }
button.item:active { background: var(--surface-2); }
.item-btn { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
.item .del { margin-right: -6px; }
.item .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; flex: none; }
.item .main { flex: 1; min-width: 0; }
.item .t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .amt { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item .chev { color: var(--muted); font-size: 18px; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); margin-left: 6px; vertical-align: 1px; }

/* ---------- Controles ---------- */
.seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 3px; margin-bottom: 12px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 9px; min-height: 38px; font-weight: 600; color: var(--text-2); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; min-height: 38px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input[type="search"], .field input, .field select, .inp {
  width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 12px;
  padding: 10px 12px; min-height: 46px; font-size: 16px; color: var(--text);
}
input::placeholder { color: var(--muted); }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
input[type="date"] { -webkit-appearance: none; appearance: none; }
.btn { border: 0; border-radius: 14px; min-height: 50px; padding: 0 18px; font-weight: 700; font-size: 16px; background: var(--surface-2); color: var(--text); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: none; color: var(--bad-text); }
.btn.block { width: 100%; margin-top: 10px; }
.btn:active { opacity: .85; }
.link { background: none; border: 0; color: var(--link); padding: 6px 4px; font-size: 16px; min-height: 40px; }
.link.strong { font-weight: 700; }

/* Ajustes estilo iOS */
.set-h { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 20px 6px 6px; }
.set-f { font-size: 13px; color: var(--muted); margin: 6px 6px 0; }
.row-set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; min-height: 52px; }
.row-set + .row-set { border-top: 1px solid var(--border); }
.row-set select { background: none; border: 0; color: var(--link); font-size: 16px; text-align: right; }
.row-set .inp { max-width: 140px; text-align: right; min-height: 40px; }
button.row-set { width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: var(--text); }
button.row-set:first-child { border-top: 0; }
button.row-set.danger { color: var(--bad-text); }
button.row-set.accent { color: var(--link); }
.budget-row .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.budget-row .name span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.del { background: none; border: 0; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; font-size: 15px; flex: none; }
.del:active { color: var(--bad-text); }

/* Switch iOS */
.switch { -webkit-appearance: none; appearance: none; width: 51px; height: 31px; border-radius: 99px; background: var(--axis); position: relative; transition: background .2s; flex: none; margin: 0; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.switch:checked { background: var(--income); }
.switch:checked::after { transform: translateX(20px); }

/* ---------- Barra de pestañas ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  height: calc(var(--tabbar-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--tabbar) 92%, transparent);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: center;
}
nav.tabs .inner { display: flex; width: 100%; max-width: 640px; }
nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; }
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button[aria-selected="true"] { color: var(--tab-on); }
.fab {
  position: fixed; z-index: 11; right: max(18px, calc(50% - 320px + 18px));
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
  width: 60px; height: 60px; border-radius: 50%; border: 0;
  background: var(--accent); color: var(--accent-ink); font-size: 34px; font-weight: 400; line-height: 1;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
  display: grid; place-items: center;
}
.fab:active { transform: scale(.94); }

/* ---------- Hoja inferior ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
.sheet-wrap.open { pointer-events: auto; }
.backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .25s; }
.sheet-wrap.open .backdrop { opacity: 1; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 640px;
  max-height: 92vh; max-height: 92dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--border);
  padding: 8px 16px calc(20px + var(--safe-b));
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.sheet-wrap.open .sheet { transform: none; }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--axis); margin: 0 auto 6px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sheet-head h3 { margin: 0; font-size: 17px; }
.amount { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 6px 0 2px; }
.amount span { font-size: 28px; color: var(--muted); font-weight: 600; }
.amount input { background: none; border: 0; font-size: 44px; font-weight: 750; width: 2ch; min-width: 1.2ch; max-width: calc(100vw - 90px); text-align: left; color: var(--text); padding: 0; letter-spacing: -0.02em; }
.amount input:focus { outline: none; }
.amount-fmt { text-align: center; color: var(--muted); font-size: 14px; min-height: 20px; margin-bottom: 12px; }
.catgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-bottom: 14px; }
.catgrid button { background: var(--surface-2); border: 1px solid transparent; border-radius: 14px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text-2); min-height: 70px; }
.catgrid button .e { font-size: 22px; }
.catgrid button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; }

<script>
'use strict';
/* =========================================================
   Datos y almacenamiento
   ========================================================= */
const STORE = 'mis-finanzas';
const OLD_STORE = 'mis-finanzas-v1';
const PBKDF2_ITER = 310000;
const AUTOLOCK_MS = 60 * 1000;

const DEFAULT_CATS = [
  ['Comida','🍽️','gasto'], ['Transporte','🚌','gasto'], ['Vivienda','🏠','gasto'], ['Servicios','💡','gasto'],
  ['Suscripciones','📺','gasto'], ['Salud','💊','gasto'], ['Ocio','🎉','gasto'], ['Compras','🛍️','gasto'],
  ['Educación','📚','gasto'], ['Otros gastos','📦','gasto'],
  ['Salario','💼','ingreso'], ['Freelance','💻','ingreso'], ['Otros ingresos','💰','ingreso'],
].map(([name, emoji, type]) => ({ name, emoji, type, budget: 0 }));

// Dónde está el dinero: cada movimiento sale o entra de una de estas cuentas
const ACCOUNTS = [
  { id: 'tarjeta',  name: 'Tarjeta',  emoji: '💳', color: 'var(--acc-card)' },
  { id: 'efectivo', name: 'Efectivo', emoji: '💵', color: 'var(--acc-cash)' },
];
const isAcc = id => ACCOUNTS.some(a => a.id === id);
const accOf = id => ACCOUNTS.find(a => a.id === id) || ACCOUNTS[0];
const otherAcc = id => ACCOUNTS.find(a => a.id !== id).id;

let state = null;        // datos descifrados en memoria
let cryptoKey = null;    // clave AES derivada del PIN (no exportable)
let kdf = null;          // { salt: Uint8Array, iter }

function normalize(s) {
  s = s && typeof s === 'object' ? s : {};
  const cats = Array.isArray(s.cats) && s.cats.length ? s.cats : structuredClone(DEFAULT_CATS);
  for (const c of cats) {
    if (!c.emoji) c.emoji = (DEFAULT_CATS.find(d => d.name === c.name) || {}).emoji || (c.type === 'ingreso' ? '💰' : '🏷️');
    c.budget = +c.budget || 0;
  }
  // Cada ingreso/gasto pertenece a una cuenta (tarjeta o efectivo). Los datos
  // anteriores a las cuentas se asignan a la tarjeta.
  const txs = (Array.isArray(s.txs) ? s.txs : []).filter(t => t && t.date && +t.amount > 0 && (
    t.type === 'transfer' ? isAcc(t.from) && isAcc(t.to) && t.from !== t.to : true));
  for (const t of txs) if (t.type !== 'transfer' && !isAcc(t.acc)) t.acc = 'tarjeta';
  const recs = Array.isArray(s.recs) ? s.recs : [];
  for (const r of recs) if (!isAcc(r.acc)) r.acc = 'tarjeta';
  // Saldo inicial: dinero en cada cuenta al empezar el día `date`.
  // El formato anterior ({ amount, date }) pasa entero a la tarjeta.
  let opening = null;
  const o = s.opening;
  if (o && /^\d{4}-\d{2}-\d{2}$/.test(o.date)) {
    if (o.amounts && typeof o.amounts === 'object') {
      opening = { date: o.date, amounts: Object.fromEntries(ACCOUNTS.map(a => [a.id, Number.isFinite(+o.amounts[a.id]) ? +o.amounts[a.id] : 0])) };
    } else if (Number.isFinite(+o.amount)) {
      opening = { date: o.date, amounts: { tarjeta: +o.amount, efectivo: 0 } };
    }
  }
  return {
    txs,
    cats,
    recs,
    goals: Array.isArray(s.goals) ? s.goals : [],
    currency: s.currency || 'EUR',
    lastBackup: s.lastBackup || null,
    opening,
    lastAcc: isAcc(s.lastAcc) ? s.lastAcc : 'tarjeta',
  };
}

const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pin, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function decryptEnv(key, env) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function readEnv() {
  try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; }
}
async function writeEnv(json) {
  let env;
  if (cryptoKey) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, new TextEncoder().encode(json));
    env = { v: 2, enc: true, salt: b64(kdf.salt), iter: kdf.iter, iv: b64(iv), ct: b64(ct) };
  } else {
    env = { v: 2, enc: false, json };
  }
  localStorage.setItem(STORE, JSON.stringify(env));
}
let saveChain = Promise.resolve();
function save() {
  const json = JSON.stringify(state);
  saveChain = saveChain.then(() => writeEnv(json)).catch(() => toast('No se pudo guardar'));
  return saveChain;
}

/* =========================================================
   Utilidades
   ========================================================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const monthOf = date => date.slice(0, 7);
function shiftMonth(ym, delta) {
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
function monthName(ym, style = 'short') {
  const d = new Date(ym + '-15T12:00');
  if (style === 'long') return d.toLocaleDateString('es', { month: 'long' }) + ' ' + d.getFullYear();
  return d.toLocaleDateString('es', { month: 'short' }).replace('.', '');
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const LOCALES = { COP: 'es-CO', USD: 'es-US', EUR: 'es-ES', MXN: 'es-MX', ARS: 'es-AR', CLP: 'es-CL', PEN: 'es-PE' };
const zeroDec = () => ['COP', 'CLP'].includes(state.currency);
function money(n, compact = false) {
  try {
    return new Intl.NumberFormat(LOCALES[state.currency] || 'es', {
      style: 'currency', currency: state.currency, currencyDisplay: 'narrowSymbol', useGrouping: 'always',
      maximumFractionDigits: compact ? 1 : zeroDec() ? 0 : 2, notation: compact ? 'compact' : 'standard',
    }).format(n);
  } catch { return String(Math.round(n)); }
}
const curSymbol = () => money(0).replace(/[\d\s.,]/g, '') || '$';
function parseAmount(s) {
  s = String(s).trim().replace(/[\s$€]|S\//g, '');
  if (!s) return NaN;
  if (zeroDec()) return Number(s.replace(/[.,]/g, ''));
  const m = s.match(/^(.*)[.,](\d{1,2})$/);
  return m ? Number(m[1].replace(/[.,]/g, '') + '.' + m[2]) : Number(s.replace(/[.,]/g, ''));
}
const catOf = name => state.cats.find(c => c.name === name) || { name, emoji: '❔', type: 'gasto', budget: 0 };
function sumWhere(pred) {
  let inc = 0, exp = 0;
  for (const t of state.txs) {
    if (!pred(t.date)) continue;
    if (t.type === 'ingreso') inc += t.amount;
    else if (t.type === 'gasto') exp += t.amount;   // las transferencias entre cuentas no cuentan
  }
  return { inc, exp, bal: inc - exp };
}
// Cuánto cambia un movimiento el saldo de una cuenta (o el total si no se indica cuenta).
// Una transferencia resta en una cuenta y suma en la otra: en el total no cambia nada.
function txDelta(t, acc) {
  if (t.type === 'transfer') return !acc ? 0 : t.from === acc ? -t.amount : t.to === acc ? t.amount : 0;
  if (acc && t.acc !== acc) return 0;
  return t.type === 'ingreso' ? t.amount : -t.amount;
}
const openingOf = acc => !state.opening ? 0 : acc ? state.opening.amounts[acc] || 0
  : Object.values(state.opening.amounts).reduce((s, v) => s + v, 0);
const totals = ym => sumWhere(d => monthOf(d) === ym);
function addDays(date, n) {
  const d = new Date(date + 'T12:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
// Saldo disponible al final del día `date` (de una cuenta o total): saldo inicial
// + ingresos − gastos desde su fecha. null si no hay saldo inicial o la fecha es anterior.
function balanceAt(date, acc) {
  const o = state.opening;
  if (!o || date < o.date) return null;
  let b = openingOf(acc);
  for (const t of state.txs) if (t.date >= o.date && t.date <= date) b += txDelta(t, acc);
  return b;
}

/* Periodo visible: un mes o un año completo */
const curYear = () => curMonth.slice(0, 4);
const inPeriod = date => period === 'year' ? date.slice(0, 4) === curYear() : monthOf(date) === curMonth;
const periodLabel = () => period === 'year' ? curYear() : monthName(curMonth, 'long');
// Meses del año que ya transcurrieron (para promedios y presupuesto acumulado)
function monthsElapsed(year) {
  const now = monthOf(today());
  if (year < now.slice(0, 4)) return 12;
  if (year > now.slice(0, 4)) return 0;
  return +now.slice(5);
}
function dayLabel(date) {
  const t = today();
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (date === t) return 'Hoy';
  if (date === `${y.getFullYear()}-${pad(y.getMonth() + 1)}-${pad(y.getDate())}`) return 'Ayer';
  return new Date(date + 'T12:00').toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
}
function monthsUntil(date) {
  const now = new Date(), d = new Date(date + 'T12:00');
  return Math.max(1, (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth());
}

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const shortDate = d => new Date(d + 'T12:00').toLocaleDateString('es', { day: 'numeric', month: 'short' }).replace('.', '');

const themeOf = id => THEMES.find(t => t.id === id) || THEMES[0];
function normalizePrefs(p) {
  p = p && typeof p === 'object' ? p : {};
  const widgets = [];
  for (const w of Array.isArray(p.widgets) ? p.widgets : []) {
    if (w && WIDGETS.some(x => x.id === w.id) && !widgets.some(x => x.id === w.id)) widgets.push({ id: w.id, on: w.on !== false });
  }
  // Widgets nuevos: visibles y colocados donde van por defecto (detrás del widget que los precede)
  WIDGETS.forEach((w, k) => {
    if (widgets.some(x => x.id === w.id)) return;
    const prevIds = WIDGETS.slice(0, k).map(x => x.id);
    let at = 0;
    widgets.forEach((x, i) => { if (prevIds.includes(x.id)) at = i + 1; });
    widgets.splice(at, 0, { id: w.id, on: true });
  });
  return {
    theme: THEMES.some(t => t.id === p.theme) ? p.theme : 'marino',
    accent: ACCENTS.some(a => a.id === p.accent) ? p.accent : 'auto',
    widgets,
  };
}
let prefs = (() => { try { return normalizePrefs(JSON.parse(localStorage.getItem(PREFS_KEY))); } catch { return normalizePrefs(null); } })();
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {} }
function relLum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const contrastRatio = (a, b) => { const [x, y] = [relLum(a), relLum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
function applyPrefs() {
  const th = themeOf(prefs.theme), root = document.documentElement;
  root.dataset.theme = th.id;
  const ac = ACCENTS.find(a => a.id === prefs.accent);
  if (!ac || !ac.color) {
    ['--accent', '--accent-ink', '--tab-on'].forEach(v => root.style.removeProperty(v));
  } else {
    // Texto sobre el acento: blanco si se lee bien, si no, casi negro
    const onWhite = contrastRatio(ac.color, '#ffffff'), onDark = contrastRatio(ac.color, '#0b0b0b');
    root.style.setProperty('--accent', ac.color);
    root.style.setProperty('--accent-ink', onWhite >= 4.5 || onWhite > onDark ? '#ffffff' : '#0b0b0b');
    // La pestaña activa usa el acento solo si contrasta con la barra
    root.style.setProperty('--tab-on', contrastRatio(ac.color, th.tabbar) >= 3 ? ac.color : th.text);
  }
  document.querySelector('meta[name="theme-color"]').setAttribute('content', th.bg);
  document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', th.light ? 'default' : 'black-translucent');
}

// freq: 'month' (cada mes) o 'year' (una vez al año, en el mes de inicio)
const recStep = r => r.freq === 'year' ? 12 : 1;
const recMonthly = r => r.amount / recStep(r);
const isSub = r => r.cat === 'Suscripciones';
const recEmoji = r => r.emoji || catOf(r.cat).emoji;
function nextChargeMonth(r) { return r.last ? shiftMonth(r.last, recStep(r)) : r.start; }
function nextCharge(r) {
  const ym = nextChargeMonth(r);
  return `${ym}-${pad(Math.min(r.day, daysInMonth(ym)))}`;
}
// Fija la próxima fecha de cobro de una regla (y desde cuándo se cuenta)
function setNextCharge(r, date) {
  const ym = monthOf(date);
  r.day = +date.slice(8);
  if (!r.start || ym < r.start) r.start = ym;
  r.last = shiftMonth(ym, -recStep(r));
}

function applyRecurring() {
  const now = today(), curYm = monthOf(now), d = +now.slice(8);
  let n = 0;
  for (const r of state.recs) {
    if (!r.active) continue;
    let ym = nextChargeMonth(r);
    while (ym <= curYm) {
      const day = Math.min(r.day, daysInMonth(ym));
      if (ym === curYm && day > d) break;
      state.txs.push({ id: uid(), type: r.type, amount: r.amount, cat: r.cat, note: r.note, date: `${ym}-${pad(day)}`, rec: r.id, acc: r.acc || 'tarjeta' });
      r.last = ym; n++;
      ym = shiftMonth(ym, recStep(r));
    }
  }
  if (n) save();
  return n;
}

function deltaTxt(cur, prev, goodWhenUp) {
  const ref = period === 'year' ? String(+curYear() - 1) : 'anterior';
  if (!prev) return period === 'year' ? `sin datos de ${ref}` : 'sin datos del mes anterior';
  const pct = (cur - prev) / Math.abs(prev) * 100;
  const up = pct >= 0;
  return `<span class="${up === goodWhenUp ? 'pos' : 'neg'}">${up ? '▲' : '▼'} ${Math.abs(pct).toFixed(0)}%</span> vs. ${ref}`;
}

function renderHome() {
  const yearMode = period === 'year';
  const year = curYear();
  const ctx = {
    yearMode, year,
    t: sumWhere(inPeriod),
    p: yearMode ? sumWhere(d => d.slice(0, 4) === String(+year - 1)) : totals(shiftMonth(curMonth, -1)),
    isCur: curMonth === monthOf(today()),
    elapsed: yearMode ? monthsElapsed(year) : 1,
  };
  let h = '';

  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  let hintHidden = false; try { hintHidden = localStorage.getItem(STORE + '-hint') === '1'; } catch {}
  if (isIOS && !standalone && !hintHidden) {

  }

  const bd = backupDays();
  if (!backupSnoozed && state.txs.length >= 5 && (bd === null || bd > 30)) {
    h += `<div class="card" style="display:flex;align-items:center;gap:12px;border-color:rgba(250,178,25,.35)">
      <span style="font-size:26px">💾</span>
      <div style="flex:1;min-width:0"><b>Haz un respaldo</b><div class="muted" style="font-size:13px">Último: ${esc(backupAge().toLowerCase())}. Tarda 10 segundos.</div></div>
      <button class="btn primary" style="min-height:40px;padding:0 14px" id="exp-json">Hacer</button>
      <button class="del" id="snooze-backup" aria-label="Recordar más tarde">✕</button>
    </div>`;
  }

  // Widgets en el orden y con la visibilidad que eligió la persona
  for (const w of prefs.widgets) if (w.on && WIDGET_FNS[w.id]) h += WIDGET_FNS[w.id](ctx);

  }
  h += `<button class="link customize" data-customize>✎ Personalizar Inicio</button>`;

  $('v-home').innerHTML = h;
  const hide = $('hide-hint');
  if (hide) hide.onclick = () => { try { localStorage.setItem(STORE + '-hint', '1'); } catch {} $('install-hint').remove(); };
}

/* Efectivo y tarjeta: saldo de cada cuenta, sus movimientos y cómo pagas */
function wCuentas({ yearMode }) {
  const now = today();
  const periodEnd = yearMode ? `${curYear()}-12-31` : `${curMonth}-${pad(daysInMonth(curMonth))}`;
  const ref = periodEnd >= now ? now : periodEnd;
  const per = Object.fromEntries(ACCOUNTS.map(a => [a.id, { inc: 0, exp: 0, n: 0, inX: 0, outX: 0 }]));
  for (const x of state.txs) {
    if (!inPeriod(x.date)) continue;
    if (x.type === 'transfer') { per[x.from].outX += x.amount; per[x.to].inX += x.amount; continue; }
    const p = per[x.acc];
    if (!p) continue;
    if (x.type === 'ingreso') p.inc += x.amount; else { p.exp += x.amount; p.n++; }
  }
  const tiles = ACCOUNTS.map(a => {
    const p = per[a.id], bal = balanceAt(ref, a.id);
    const moves = [
      p.exp ? `−${esc(money(p.exp))} en gastos` : '',
      p.inc ? `+${esc(money(p.inc))} en ingresos` : '',
      p.inX ? `+${esc(money(p.inX))} recibido de ${esc(accOf(otherAcc(a.id)).name.toLowerCase())}` : '',
      p.outX ? `−${esc(money(p.outX))} pasado a ${esc(accOf(otherAcc(a.id)).name.toLowerCase())}` : '',
    ].filter(Boolean);
    return `<div class="acc-tile">
      <div class="h"><i class="dot" style="background:${a.color}"></i>${a.emoji} ${esc(a.name)}</div>
      ${bal === null ? `<div class="bal muted" style="font-size:14px;font-weight:600">Sin saldo inicial</div>` : `<div class="bal ${bal < 0 ? 'neg' : ''}">${esc(money(bal))}</div>`}
      <div class="mv">${moves.length ? moves.join('<br>') : `Sin movimientos ${yearMode ? 'este año' : 'este mes'}`}</div>
    </div>`;
  }).join('');

  // Cómo pagaste: reparto de los gastos del periodo entre tarjeta y efectivo
  const totalExp = ACCOUNTS.reduce((s, a) => s + per[a.id].exp, 0);
  let split = '';
  if (totalExp) {
    const pcts = ACCOUNTS.map(a => Math.round(per[a.id].exp / totalExp * 100));
    pcts[pcts.length - 1] = 100 - pcts.slice(0, -1).reduce((s, v) => s + v, 0);
    split = `<div class="w-sub" style="margin:14px 0 0">Cómo pagaste tus gastos ${yearMode ? 'este año' : 'este mes'}</div>
      <div class="stack" role="img" aria-label="${ACCOUNTS.map((a, i) => `${a.name} ${pcts[i]}%`).join(', ')}">${ACCOUNTS.map((a, i) => per[a.id].exp
        ? `<div style="flex:${per[a.id].exp};background:${a.color}" data-tip="${esc(`<b>${a.emoji} ${a.name}</b>${esc(money(per[a.id].exp))} · ${pcts[i]}%<br>${per[a.id].n} ${per[a.id].n === 1 ? 'pago' : 'pagos'}`)}"></div>` : '').join('')}</div>
      <div class="lg">${ACCOUNTS.map((a, i) => `<div><i class="dot" style="background:${a.color}"></i><span>${a.emoji} ${esc(a.name)} <span class="muted" style="font-size:12px">${per[a.id].n} ${per[a.id].n === 1 ? 'pago' : 'pagos'}</span></span><b>${esc(money(per[a.id].exp))} · ${pcts[i]}%</b></div>`).join('')}</div>`;
  }
  const actions = `<div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn" style="flex:1;min-height:42px;font-size:14px;padding:0 8px" data-xfer="tarjeta">🏧 Sacar efectivo</button>
    <button class="btn" style="flex:1;min-height:42px;font-size:14px;padding:0 8px" data-xfer="efectivo">🏦 Ingresar efectivo</button>
  </div>`;
  const hint = state.opening ? '' : `<div class="muted" style="font-size:12px;margin-top:10px">Indica cuánto tienes en cada uno en <button class="link" data-opening style="font-size:12px;padding:0;min-height:0">saldos iniciales</button> para ver tus saldos.</div>`;
  return card('Efectivo y tarjeta', `<div class="acc-tiles">${tiles}</div>${split}${actions}${hint}`,
    state.opening ? rightNote(ref === now ? 'Saldo hoy' : 'Saldo al cierre') : '');
}

/* Ritmo de gasto: cuánto puedes gastar al día y proyección */
function wRitmo({ yearMode, year, t }) {
  const title = 'Ritmo de gasto';
  const now = today(), curYm = monthOf(now);
  if (yearMode) {
    const m = monthsElapsed(year);
    if (!m) return card(title, emptyMsg('Este año aún no empieza.'));
    if (!t.exp && !t.inc) return card(title, emptyMsg(`Sin movimientos en ${esc(year)}.`));
    const avg = t.exp / m;
    const months = Array.from({ length: m }, (_, i) => `${year}-${pad(i + 1)}`).map(ym => ({ ym, exp: totals(ym).exp }));
    const top = months.reduce((a, b) => b.exp > a.exp ? b : a);
    let body = `<div class="w-big num">${esc(money(avg))}<small> /mes</small></div><div class="w-sub">Gasto mensual promedio en ${esc(year)}</div>`;
    if (m < 12) {
      const projExp = t.exp + avg * (12 - m);
      const projSave = t.inc + (t.inc / m) * (12 - m) - projExp;
      body += `<div class="w-row"><span>Gastos proyectados del año</span><b>${esc(money(projExp))}</b></div>
        <div class="w-row"><span>Ahorro proyectado al cierre</span><b class="${projSave < 0 ? 'neg' : 'pos'}">${esc(money(projSave))}</b></div>`;
    }
    if (top.exp) body += `<div class="w-row"><span>Mes de más gasto</span><b>${esc(cap(monthName(top.ym, 'long').split(' ')[0]))} · ${esc(money(top.exp))}</b></div>`;
    return card(title, body);
  }

  const ym = curMonth, D = daysInMonth(ym);
  if (ym > curYm) return card(title, emptyMsg('Este mes aún no empieza.'));
  const exps = state.txs.filter(x => x.type === 'gasto' && monthOf(x.date) === ym);
  const S = sumAmt(exps), Svar = sumAmt(exps.filter(x => !x.rec));
  const budget = state.cats.filter(c => c.type === 'gasto').reduce((s, c) => s + c.budget, 0);

  if (ym < curYm) {   // mes ya cerrado: resumen del ritmo
    if (!S) return card(title, emptyMsg(`Sin gastos en ${esc(monthName(ym, 'long'))}.`));
    const byDay = {};
    for (const x of exps) byDay[x.date] = (byDay[x.date] || 0) + x.amount;
    const [topD, topV] = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
    let body = `<div class="w-big num">${esc(money(S / D))}<small> /día</small></div><div class="w-sub">Gasto diario promedio en ${esc(monthName(ym, 'long'))}</div>
      <div class="w-row"><span>Día de más gasto</span><b>${esc(shortDate(topD))} · ${esc(money(topV))}</b></div>`;
    if (budget) body += `<div class="w-status ${S > budget ? 'neg' : 'pos'}">${S > budget ? '⚠ Superaste' : '✓ Cumpliste'} tu presupuesto (${Math.round(S / budget * 100)}% usado)</div>`;
    return card(title, body);
  }

  // Mes en curso
  const d = +now.slice(8), daysLeft = D - d;
  const pend = state.recs.filter(r => r.active && nextChargeMonth(r) === ym);
  const pendingFixed = sumAmt(pend.filter(r => r.type === 'gasto'));
  const pendingInc = sumAmt(pend.filter(r => r.type === 'ingreso'));
  const base = budget || (t.inc + pendingInc);
  const baseTxt = budget ? 'tu presupuesto' : 'tus ingresos';
  if (!base) return card(title, emptyMsg('Define un presupuesto en Ajustes o registra tus ingresos para saber cuánto puedes gastar al día.'));
  const varBudget = base - (S - Svar) - pendingFixed;   // lo que queda para gasto variable en todo el mes
  const remaining = varBudget - Svar;
  const perDay = remaining / (daysLeft + 1);            // incluye hoy
  const projection = S + (Svar / d) * daysLeft + pendingFixed;
  const timePct = d / D;
  const usedPct = varBudget > 0 ? Svar / varBudget : 1;
  const fast = varBudget > 0 && usedPct > timePct + 0.05;

  let body = remaining > 0
    ? `<div class="w-big num">${esc(money(perDay))}<small> /día</small></div><div class="w-sub">Puedes gastar esto cada día hasta fin de mes sin pasarte de ${baseTxt}.</div>`
    : `<div class="w-big num neg">${esc(money(remaining))}</div><div class="w-sub">Ya no te queda margen: superaste ${baseTxt}${pendingFixed ? ' contando los cobros fijos pendientes' : ''}.</div>`;
  if (varBudget > 0) {
    const tip = `<b>Gasto variable</b>${esc(money(Svar))} de ${esc(money(varBudget))}<br>Mes transcurrido: ${Math.round(timePct * 100)}%`;
    body += `<div class="pace" data-tip="${esc(tip)}"><div class="fill" style="width:${Math.min(100, usedPct * 100)}%"></div><div class="now" style="left:calc(${timePct * 100}% - 1px)"></div></div>
      <div class="pace-l"><span>Variable: ${Math.round(usedPct * 100)}% de ${esc(money(varBudget))}</span><span>▏ hoy, ${Math.round(timePct * 100)}% del mes</span></div>`;
  }
  body += `<div class="w-row"><span>Proyección a fin de mes</span><b class="${projection > base ? 'neg' : ''}">${esc(money(projection))}</b></div>`;
  if (pendingFixed) body += `<div class="w-row"><span>Cobros fijos pendientes</span><b>${esc(money(pendingFixed))}</b></div>`;
  const balNow = balanceAt(now);
  if (balNow !== null) {
    const endBal = balNow + pendingInc - pendingFixed - (Svar / d) * daysLeft;
    body += `<div class="w-row"><span>Saldo previsto a fin de mes</span><b class="${endBal < 0 ? 'neg' : ''}">${esc(money(endBal))}</b></div>`;
  }
  const status = fast ? ['neg', '▲ Vas gastando más rápido de lo que avanza el mes']
    : projection > base ? ['neg', `⚠ A este ritmo te pasarás de ${baseTxt}`]
    : ['pos', '✓ Vas a buen ritmo'];
  body += `<div class="w-status ${status[0]}">${status[1]}</div>`;
  return card(title, body, rightNote(`Día ${d} de ${D}`));
}

/* Próximos cobros del mes en curso */
function wProximos({ yearMode, isCur }) {
  if (yearMode || !isCur || !state.recs.some(r => r.active)) return '';
  const link = `<button class="link" data-goto="rec">Ver todos</button>`;
  const up = state.recs.filter(r => r.active && nextChargeMonth(r) === curMonth).sort((a, b) => a.day - b.day);
  if (!up.length) return card('Próximos cobros', emptyMsg('✓ No quedan cobros fijos pendientes este mes.'), link);
  const out = sumAmt(up.filter(r => r.type === 'gasto'));
  return card('Próximos cobros', up.slice(0, 5).map(r => `<div class="cat" style="grid-template-columns:30px 1fr auto;margin-bottom:10px"><span class="ico" style="grid-row:auto">${esc(recEmoji(r))}</span>
      <span>${esc(r.note || r.cat)}<br><span class="muted" style="font-size:13px">Día ${Math.min(r.day, daysInMonth(curMonth))}</span></span>
      <b class="num ${r.type === 'ingreso' ? 'pos' : ''}">${r.type === 'ingreso' ? '+' : '−'}${esc(money(r.amount))}</b></div>`).join('')
    + (out ? `<div class="w-row" style="border-top:1px solid var(--border);padding-top:8px"><span>Total por pagar</span><b>${esc(money(out))}</b></div>` : ''), link);
}

/* Saldo acumulado día a día (o mes a mes en vista anual) */
// Con saldo inicial muestra el saldo real; sin él, ingresos − gastos acumulados del periodo.
function wSaldo({ yearMode, year }) {
  const now = today(), curYm = monthOf(now);
  const o = state.opening;
  const title = yearMode ? 'Saldo mes a mes' : 'Saldo día a día';
  let pts = [], total, labelFor, sub, real;
  if (yearMode) {
    const m = monthsElapsed(year);
    if (!m) return card(title, emptyMsg('Este año aún no empieza.'));
    real = !!o && o.date <= `${year}-12-31`;
    let acc = 0;
    for (let i = 1; i <= m; i++) {
      const ym = `${year}-${pad(i)}`, tt = totals(ym);
      const delta = `<br>Ese mes: ${tt.bal >= 0 ? '+' : ''}${esc(money(tt.bal))}`;
      if (real) {
        const end = ym === curYm ? now : `${ym}-${pad(daysInMonth(ym))}`;
        const b = balanceAt(end);
        if (b === null) continue;   // meses anteriores al saldo inicial
        const split = ACCOUNTS.map(a => `${a.emoji} ${esc(money(balanceAt(end, a.id)))}`).join(' · ');
        pts.push({ i: i - 1, v: b, tip: `<b>${esc(cap(monthName(ym, 'long')))}</b>Saldo ${ym === curYm ? 'hoy' : 'al cierre'}: ${esc(money(b))}<br>${split}${delta}` });
      } else {
        acc += tt.bal;
        pts.push({ i: i - 1, v: acc, tip: `<b>${esc(cap(monthName(ym, 'long')))}</b>Acumulado: ${esc(money(acc))}${delta}` });
      }
    }
    if (!pts.length) return card(title, emptyMsg(`Tu saldo inicial empieza el ${esc(shortDate(o.date))}.`));
    total = 12; labelFor = i => monthName(`${year}-${pad(i + 1)}`).charAt(0).toUpperCase();
    sub = real ? 'Tu saldo disponible al cierre de cada mes.' : 'Lo que llevas ahorrado (o gastado de más) en el año, acumulado mes a mes.';
  } else {
    const ym = curMonth, D = daysInMonth(ym);
    if (ym > curYm) return card(title, emptyMsg('Este mes aún no empieza.'));
    const last = ym === curYm ? +now.slice(8) : D;
    // Variación diaria total y por cuenta (las transferencias solo mueven dinero entre cuentas)
    const net = Array(D + 1).fill(0);
    const netAcc = Object.fromEntries(ACCOUNTS.map(a => [a.id, Array(D + 1).fill(0)]));
    let any = false;
    for (const x of state.txs) {
      if (monthOf(x.date) !== ym) continue;
      const day = +x.date.slice(8);
      net[day] += txDelta(x);
      for (const a of ACCOUNTS) netAcc[a.id][day] += txDelta(x, a.id);
      any = true;
    }
    real = !!o && o.date <= `${ym}-${pad(last)}`;
    let first = 1, acc = 0;
    const accBal = {};
    if (real) {
      const startsInside = o.date >= `${ym}-01`;
      if (startsInside) first = +o.date.slice(8);                     // empieza dentro del mes
      const before = addDays(`${ym}-01`, -1);                           // saldo con el que empezó el mes
      acc = startsInside ? openingOf() : balanceAt(before);
      for (const a of ACCOUNTS) accBal[a.id] = startsInside ? openingOf(a.id) : balanceAt(before, a.id);
    } else if (!any) return card(title, emptyMsg('Sin movimientos este mes.'));
    for (let i = first; i <= last; i++) {
      acc += net[i];
      let split = '';
      if (real) {
        for (const a of ACCOUNTS) accBal[a.id] += netAcc[a.id][i];
        split = '<br>' + ACCOUNTS.map(a => `${a.emoji} ${esc(money(accBal[a.id]))}`).join(' · ');
      }
      pts.push({ i: i - 1, v: acc, tip: `<b>${i} de ${esc(monthName(ym, 'long').split(' ')[0])}</b>Saldo: ${esc(money(acc))}${split}${net[i] ? `<br>Ese día: ${net[i] > 0 ? '+' : ''}${esc(money(net[i]))}` : ''}` });
    }
    total = D; labelFor = i => (i === 0 || (i + 1) % 5 === 0) ? String(i + 1) : '';
    sub = real ? 'Tu saldo disponible cada día (saldo inicial + ingresos − gastos).' : 'Ingresos menos gastos acumulados desde el día 1.';
  }
  const lastP = pts[pts.length - 1];
  const minP = pts.reduce((b, p) => p.v < b.v ? p : b, pts[0]);
  const minLbl = yearMode ? cap(monthName(`${year}-${pad(minP.i + 1)}`, 'long').split(' ')[0]) : `día ${minP.i + 1}`;
  const isNow = curYm === curMonth || (yearMode && year === now.slice(0, 4));
  let body = `<div class="w-sub" style="margin-top:0">${sub}</div>
    <div class="w-row" style="margin:0 0 6px"><span>${real ? 'Saldo' : yearMode ? 'Acumulado' : 'Saldo del mes'} ${isNow ? 'a hoy' : 'al cierre'}</span><b class="${lastP.v < 0 ? 'neg' : ''}">${esc(money(lastP.v))}</b></div>
    <div class="w-row" style="margin:0 0 8px"><span>Punto más bajo</span><b class="${minP.v < 0 ? 'neg' : ''}">${esc(money(minP.v))} · ${esc(minLbl)}</b></div>
    ${lineSvg(pts, total, labelFor, yearMode ? 'Saldo por mes' : 'Saldo por día')}`;
  if (!o) body += `<div class="muted" style="font-size:12px;margin-top:6px">Define tu <button class="link" data-opening style="font-size:12px;padding:0;min-height:0">saldo inicial</button> para ver tu saldo real día a día.</div>`;
  return card(title, body);
}

/* Gastos por categoría con presupuesto (en vista anual se acumula) */
function wCategorias({ yearMode, t, elapsed }) {
  const spent = {};
  for (const x of state.txs) if (x.type === 'gasto' && inPeriod(x.date)) spent[x.cat] = (spent[x.cat] || 0) + x.amount;
  const names = new Set([...Object.keys(spent), ...state.cats.filter(c => c.type === 'gasto' && c.budget).map(c => c.name)]);
  const cats = [...names].map(n => { const c = catOf(n); return { ...c, budget: c.budget * elapsed, spent: spent[n] || 0 }; })
    .sort((a, b) => b.spent - a.spent);
  const totalBudget = state.cats.filter(c => c.type === 'gasto').reduce((s, c) => s + c.budget, 0) * elapsed;
  const budgetWord = yearMode ? (elapsed < 12 ? 'Presupuesto a la fecha' : 'Presupuesto anual') : 'Presupuesto';
  const right = totalBudget ? rightNote(`${esc(money(t.exp, true))} de ${esc(money(totalBudget, true))}`) : '';
  if (!cats.length) return card('Gastos por categoría', emptyMsg(`Aún no hay gastos ${yearMode ? 'este año' : 'este mes'}. Toca <b>+</b> para registrar el primero.`), right);
  const max = Math.max(...cats.map(c => Math.max(c.spent, c.budget)));
  let body = cats.map(c => {
    const over = c.budget && c.spent > c.budget;
    const r = c.budget ? (over ? `<span class="over">⚠ Excedido ${esc(money(c.spent - c.budget))}</span>` : `quedan ${esc(money(c.budget - c.spent))}`) : '';
    const tip = `<b>${esc(c.name)}</b>Gastado: ${esc(money(c.spent))}${c.budget ? `<br>Presupuesto: ${esc(money(c.budget))}` : ''}`;
    return `<div class="cat" data-tip="${esc(tip)}">
      <span class="ico">${esc(c.emoji)}</span>
      <div><div class="top"><b>${esc(c.name)}</b><span class="num">${esc(money(c.spent))}</span></div>
      <div class="track"><div class="fill" style="width:${max ? c.spent / max * 100 : 0}%"></div>${c.budget ? `<div class="budget-tick" style="left:calc(${c.budget / max * 100}% - 1px)"></div>` : ''}</div></div>
      <div class="meta"><span>${c.budget ? budgetWord + ' ' + esc(money(c.budget)) : ''}</span><span>${r}</span></div>
    </div>`;
  }).join('');
  body += cats.some(c => c.budget)
    ? `<div class="muted" style="font-size:12px;margin-top:10px">La línea vertical marca el presupuesto.</div>`
    : `<div class="muted" style="font-size:12px;margin-top:10px">Define presupuestos en <button class="link" data-goto="settings" style="font-size:12px;padding:0;min-height:0">Ajustes</button>.</div>`;
  return card('Gastos por categoría', body, right);
}

/* Cambios por categoría frente al periodo anterior (comparación justa si el periodo está en curso) */
function wCambios({ yearMode, year, isCur }) {
  const now = today();
  let curPred, prevPred, partial = false, ref;
  if (yearMode) {
    const prevY = String(+year - 1);
    ref = prevY;
    if (year === now.slice(0, 4)) {
      partial = true;
      const md = now.slice(5);
      curPred = d => d.slice(0, 4) === year && d <= now;
      prevPred = d => d.slice(0, 4) === prevY && d.slice(5) <= md;
    } else {
      curPred = d => d.slice(0, 4) === year;
      prevPred = d => d.slice(0, 4) === prevY;
    }
  } else {
    const pm = shiftMonth(curMonth, -1);
    ref = monthName(pm, 'long').split(' ')[0];
    curPred = d => monthOf(d) === curMonth;
    if (isCur) { partial = true; const day = now.slice(8); prevPred = d => monthOf(d) === pm && d.slice(8) <= day; }
    else prevPred = d => monthOf(d) === pm;
  }
  const title = `Cambios vs. ${esc(ref)}`;
  const cur = {}, prev = {};
  for (const x of state.txs) {
    if (x.type !== 'gasto') continue;
    if (curPred(x.date)) cur[x.cat] = (cur[x.cat] || 0) + x.amount;
    else if (prevPred(x.date)) prev[x.cat] = (prev[x.cat] || 0) + x.amount;
  }
  const prevTotal = Object.values(prev).reduce((s, v) => s + v, 0);
  const curTotal = Object.values(cur).reduce((s, v) => s + v, 0);
  if (!prevTotal) return card(title, emptyMsg(`Aún no hay gastos de ${esc(ref)} para comparar.`));
  const rows = [...new Set([...Object.keys(cur), ...Object.keys(prev)])]
    .map(n => ({ c: catOf(n), cur: cur[n] || 0, prev: prev[n] || 0 }))
    .map(r => ({ ...r, diff: r.cur - r.prev }))
    .filter(r => Math.abs(r.diff) >= 0.01)
    .sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff)).slice(0, 5);
  const tPct = (curTotal - prevTotal) / prevTotal * 100;
  const right = `<span class="${tPct > 0 ? 'neg' : 'pos'}" style="font-size:13px;font-weight:600">Total ${tPct > 0 ? '▲' : '▼'} ${Math.abs(tPct).toFixed(0)}%</span>`;
  if (!rows.length) return card(title, emptyMsg('Gastaste lo mismo en cada categoría.'), right);
  const maxAbs = Math.max(...rows.map(r => Math.abs(r.diff)));
  let body = rows.map(r => {
    const up = r.diff > 0;
    const tip = `<b>${esc(r.c.name)}</b>${esc(cap(ref))}: ${esc(money(r.prev))}<br>Ahora: ${esc(money(r.cur))}`;
    return `<div class="chg" data-tip="${esc(tip)}">
      <span class="ico">${esc(r.c.emoji)}</span><span class="nm">${esc(r.c.name)}</span>
      <span class="dv ${up ? 'neg' : 'pos'}">${up ? '▲ +' : '▼ −'}${esc(money(Math.abs(r.diff)))}</span>
      <div class="sub"><div class="div-track"><i class="${up ? 'up' : 'down'}" style="width:calc(${Math.abs(r.diff) / maxAbs * 50}% - 1px)"></i></div>
      <span class="num">${esc(money(r.prev, true))} → ${esc(money(r.cur, true))}</span></div>
    </div>`;
  }).join('');
  body += `<div class="muted" style="font-size:12px;margin-top:10px">${partial ? `Comparado con los mismos días de ${esc(ref)}. ` : ''}▲ gastaste más · ▼ gastaste menos.</div>`;
  return card(title, body, right);
}

/* Los 5 gastos más grandes del periodo */
function wMayores({ yearMode, t }) {
  const top = state.txs.filter(x => x.type === 'gasto' && inPeriod(x.date)).sort((a, b) => b.amount - a.amount).slice(0, 5);
  if (!top.length) return card('Mayores gastos', emptyMsg('Aún no hay gastos en este periodo.'));
  const share = t.exp ? sumAmt(top) / t.exp * 100 : 0;
  return card('Mayores gastos', top.map(x => `<button class="mini" data-edit="${x.id}">
      <span class="e">${esc(catOf(x.cat).emoji)}</span>
      <span class="m"><span class="t">${esc(x.note || x.cat)}</span><span class="s">${accOf(x.acc).emoji} ${esc(x.cat)} · ${esc(shortDate(x.date))}${x.rec ? ' · ↻' : ''}</span></span>
      <span class="a">−${esc(money(x.amount))}</span></button>`).join('')
    + `<div class="muted" style="font-size:12px;margin-top:8px">Estos ${top.length} suman el ${Math.round(share)}% de tus gastos ${yearMode ? 'del año' : 'del mes'}.</div>`);
}

/* Fijos (recurrentes y suscripciones) frente a variables */
function wFijos({ t }) {
  const title = 'Fijos vs. variables';
  const exps = state.txs.filter(x => x.type === 'gasto' && inPeriod(x.date));
  const total = sumAmt(exps);
  if (!total) return card(title, emptyMsg('Aún no hay gastos en este periodo.'));
  const fixed = sumAmt(exps.filter(x => x.rec)), variable = total - fixed;
  const fp = Math.round(fixed / total * 100);
  const seg = (v, color, name) => v > 0 ? `<div style="flex:${v};background:${color}" data-tip="${esc(`<b>${name}</b>${esc(money(v))} · ${Math.round(v / total * 100)}%`)}"></div>` : '';
  let body = `<div class="stack" role="img" aria-label="Fijos ${fp}%, variables ${100 - fp}%">${seg(fixed, 'var(--fixed)', 'Fijos')}${seg(variable, 'var(--expense)', 'Variables')}</div>
    <div class="lg">
      <div><i class="dot" style="background:var(--fixed)"></i><span>Fijos <span class="muted" style="font-size:12px">suscripciones y gastos fijos</span></span><b>${esc(money(fixed))} · ${fp}%</b></div>
      <div><i class="dot" style="background:var(--expense)"></i><span>Variables</span><b>${esc(money(variable))} · ${100 - fp}%</b></div>
    </div>`;
  if (!fixed && !state.recs.length) {
    body += `<div class="muted" style="font-size:12px;margin-top:10px">Agrega tu alquiler y suscripciones en <button class="link" data-goto="rec" style="font-size:12px;padding:0;min-height:0">Suscripciones y fijos</button> para ver esta comparación.</div>`;
  } else if (t.inc > 0) {
    const ratio = Math.round(fixed / t.inc * 100);
    body += `<div class="w-status ${ratio > 50 ? 'neg' : 'pos'}">${ratio > 50 ? '⚠' : '✓'} Tus fijos son el ${ratio}% de tus ingresos${ratio > 50 ? ': te dejan poco margen' : ''}. Lo recomendable es menos del 50%.</div>`;
  }
  return card(title, body);
}

/* Promedio de gasto variable por día de la semana */
function wSemana({ yearMode, year }) {
  const title = 'Gasto por día de la semana';
  const now = today();
  let start = yearMode ? `${year}-01-01` : `${curMonth}-01`;
  let end = yearMode ? `${year}-12-31` : `${curMonth}-${pad(daysInMonth(curMonth))}`;
  if (start > now) return card(title, emptyMsg('Este periodo aún no empieza.'));
  if (end > now) end = now;
  const counts = Array(7).fill(0), sums = Array(7).fill(0);
  for (let dt = new Date(start + 'T12:00'), last = new Date(end + 'T12:00'); dt <= last; dt.setDate(dt.getDate() + 1)) counts[(dt.getDay() + 6) % 7]++;
  for (const x of state.txs) {
    if (x.type === 'gasto' && !x.rec && x.date >= start && x.date <= end) sums[(new Date(x.date + 'T12:00').getDay() + 6) % 7] += x.amount;
  }
  if (!sums.some(v => v)) return card(title, emptyMsg('Aún no hay gastos variables en este periodo.'));
  const avgs = sums.map((s, i) => counts[i] ? s / counts[i] : 0);
  const maxI = avgs.indexOf(Math.max(...avgs));
  const DOW = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
  const LETTER = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  const PLURAL = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábados', 'domingos'];
  const W = 360, H = 150, L = 6, R = 6, T = 22, B = 22;
  const max = niceMax(avgs[maxI]);
  const y = v => T + (H - T - B) * (1 - v / max);
  const slot = (W - L - R) / 7, bw = Math.min(30, slot * 0.6);
  let s = `<line class="baseline" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  avgs.forEach((v, i) => {
    const cx = L + slot * i + slot / 2;
    s += `<path d="${barPath(cx - bw / 2, y(v), bw, y(0) - y(v), 4)}" fill="var(--expense)" ${i === maxI ? '' : 'fill-opacity=".55"'}/>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" style="${i === maxI ? 'fill:var(--text);font-weight:700' : ''}">${LETTER[i]}</text>`;
    if (i === maxI) s += `<text class="vlab" x="${cx}" y="${y(v) - 6}" text-anchor="middle">${esc(money(v, true))}</text>`;
    const tip = `<b>${DOW[i]}</b>Promedio: ${esc(money(v))}<br>Total: ${esc(money(sums[i]))} en ${counts[i]} ${counts[i] === 1 ? 'día' : 'días'}`;
    s += `<rect class="hit" rx="6" x="${L + slot * i + 1}" y="${T - 16}" width="${slot - 2}" height="${H - T - B + 16}" data-tip="${esc(tip)}"/>`;
  });
  const body = `<div class="w-sub" style="margin-top:0">Gastas más los <b>${PLURAL[maxI]}</b>: ${esc(money(avgs[maxI]))} de media.</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto promedio por día de la semana">${s}</svg>
    <div class="muted" style="font-size:12px;margin-top:6px">Solo gastos variables (sin fijos ni suscripciones).</div>`;
  return card(title, body);
}

/* Tendencia mensual (+ resumen por mes en vista anual) */
function wTendencia({ yearMode, year, elapsed }) {
  const months = yearMode
    ? Array.from({ length: 12 }, (_, i) => `${year}-${pad(i + 1)}`)
    : Array.from({ length: 6 }, (_, i) => shiftMonth(curMonth, i - 5));
  let h = card(yearMode ? 'Mes a mes' : 'Últimos 6 meses',

  if (yearMode) {
    const rows = months.slice(0, elapsed || 12).map(m => ({ m, ...totals(m) })).reverse();
    h += `<div class="list-h"><span>Resumen por mes</span><span>Balance</span></div><div class="list">` +
      rows.map(r => `<button class="item" data-month="${r.m}" style="min-height:56px">
        <span class="main"><span class="t" style="display:block;text-transform:capitalize">${esc(monthName(r.m, 'long').split(' ')[0])}</span>
        <span class="s num" style="display:block"><span style="color:var(--income)">▲</span> ${esc(money(r.inc))} · <span style="color:var(--expense)">▼</span> ${esc(money(r.exp))}</span></span>
        <span class="amt ${r.bal < 0 ? 'neg' : r.bal > 0 ? 'pos' : ''}">${esc(money(r.bal))}</span><span class="chev">›</span>

/* Gráfico de línea con eje en cero, crosshair y tooltip por punto */
function lineSvg(pts, total, labelFor, aria) {
  const W = 360, H = 170, L = 46, R = 10, T = 10, B = 22;
  const vals = pts.map(p => p.v);
  let hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
  hi = hi > 0 ? niceMax(hi) : 0;
  lo = lo < 0 ? -niceMax(-lo) : 0;
  if (hi === lo) hi = 1;
  const y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  const step = (W - L - R) / Math.max(1, total - 1);
  const x = i => L + step * i;
  let s = '';
  const ticks = [...new Set([hi, hi / 2, 0, lo / 2, lo])].filter(v => v <= hi && v >= lo);
  for (const v of ticks) {
    s += `<line class="${v === 0 ? 'zero' : 'gridline'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${esc(money(v, true))}</text>`;
  }
  for (let i = 0; i < total; i++) { const lb = labelFor(i); if (lb) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(lb)}</text>`; }
  // Cada punto lleva su posición `i` (día o mes); así la línea puede empezar a mitad de periodo
  const px = (p, k) => x(p.i ?? k);
  s += `<path class="net" d="${pts.map((p, k) => `${k ? 'L' : 'M'}${px(p, k).toFixed(1)},${y(p.v).toFixed(1)}`).join('')}"/>`;
  const lp = pts[pts.length - 1];
  s += `<circle class="end" cx="${px(lp, pts.length - 1)}" cy="${y(lp.v)}" r="4.5"/>`;
  pts.forEach((p, k) => {
    const i = p.i ?? k;
    const x0 = Math.max(L - 4, x(i) - step / 2), x1 = Math.min(W - R + 4, x(i) + step / 2);
    s += `<g class="pt" data-tip="${esc(p.tip)}"><rect class="hit" x="${x0}" y="${T}" width="${x1 - x0}" height="${H - T - B}"/>
      <line class="xh" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}"/><circle class="pm" cx="${x(i)}" cy="${y(p.v)}" r="5"/></g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${s}</svg>`;
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
function barPath(x, y, w, h, r) {
  if (h <= 0.5) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function trendSvg(months) {
  const data = months.map(m => ({ m, ...totals(m) }));
  const dense = months.length > 6;
  if (!data.some(d => d.inc || d.exp)) return `<div class="empty">Sin movimientos en este periodo.</div>`;
  const W = 360, H = 200, L = 44, R = 4, T = 8, B = 24;
  const max = niceMax(Math.max(...data.map(d => Math.max(d.inc, d.exp))));
  const y = v => T + (H - T - B) * (1 - v / max);
  const slot = (W - L - R) / months.length;
  const bw = Math.min(18, slot * (dense ? 0.38 : 0.32));
  let s = '';
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, yy = y(v);
    s += `<line class="${i ? 'gridline' : 'baseline'}" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/>`;
    s += `<text x="${L - 6}" y="${yy + 4}" text-anchor="end">${esc(money(v, true))}</text>`;
  }
  data.forEach((d, i) => {
    const cx = L + slot * i + slot / 2;
    s += `<path d="${barPath(cx - bw - 1, y(d.inc), bw, y(0) - y(d.inc), 4)}" fill="var(--income)"/>`;
    s += `<path d="${barPath(cx + 1, y(d.exp), bw, y(0) - y(d.exp), 4)}" fill="var(--expense)"/>`;
    const lbl = dense ? monthName(d.m).charAt(0).toUpperCase() : monthName(d.m);
    const hl = dense ? d.m === monthOf(today()) : d.m === curMonth;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" style="${hl ? 'fill:var(--text);font-weight:700' : ''}">${esc(lbl)}</text>`;
    const tip = `<b>${esc(monthName(d.m, 'long'))}</b>Ingresos: ${esc(money(d.inc))}<br>Gastos: ${esc(money(d.exp))}<br>Balance: ${esc(money(d.bal))}`;
    s += `<rect class="hit" rx="6" x="${L + slot * i + 1}" y="${T}" width="${slot - 2}" height="${H - T - B}" data-tip="${esc(tip)}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos por mes">${s}</svg>`;
}

/* =========================================================
   Vista: Movimientos
   ========================================================= */
function renderTx() {
  document.querySelectorAll('#tx-mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === txMode));
  $('tx-hist').hidden = txMode !== 'hist';
  $('tx-rec').hidden = txMode !== 'rec';
  if (txMode === 'rec') return renderRecs();
  document.querySelectorAll('#tx-filter button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === txFilter));
  document.querySelectorAll('#tx-acc button').forEach(b => b.setAttribute('aria-pressed', b.dataset.a === txAcc));
  const q = $('search').value.trim().toLowerCase();
  const acc = txAcc === 'all' ? undefined : txAcc;
  const inAcc = t => !acc || (t.type === 'transfer' ? t.from === acc || t.to === acc : t.acc === acc);
  const text = t => t.type === 'transfer' ? `${t.note || ''} ${accOf(t.from).name} ${accOf(t.to).name} movido` : `${t.note || ''} ${t.cat} ${accOf(t.acc).name}`;
  const rows = state.txs
    .filter(t => inPeriod(t.date) && (txFilter === 'all' || t.type === txFilter) && inAcc(t) && (!q || text(t).toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  if (!rows.length) {
    $('tx-list').innerHTML = `<div class="card empty" style="margin-top:12px">${q || txFilter !== 'all' || acc ? 'Sin resultados para este filtro.' : 'No hay movimientos en ' + esc(periodLabel()) + '.'}</div>`;
    return;
  }
  // Vista mensual: agrupado por día. Vista anual: agrupado por mes.
  const yearMode = period === 'year';
  const groupKey = t => yearMode ? monthOf(t.date) : t.date;
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const groupLabel = k => cap(yearMode ? monthName(k, 'long').split(' ')[0] : dayLabel(k));
  const shortDate = d => new Date(d + 'T12:00').toLocaleDateString('es', { day: 'numeric', month: 'short' }).replace('.', '');
  const groups = new Map();
  for (const t of rows) { const k = groupKey(t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
  let h = '';
  if (yearMode) {
    const tt = rows.reduce((s, t) => (t.type === 'ingreso' ? s.inc += t.amount : t.type === 'gasto' ? s.exp += t.amount : 0, s), { inc: 0, exp: 0 });
    h += `<div class="card" style="display:flex;justify-content:space-between;gap:8px;padding:12px 16px;margin-top:4px">
      <span><span class="muted" style="font-size:13px">${rows.length} movimientos</span></span>
      <span class="num" style="font-size:14px"><span style="color:var(--income)">▲</span> ${esc(money(tt.inc, true))} · <span style="color:var(--expense)">▼</span> ${esc(money(tt.exp, true))}</span></div>`;
  }
  for (const [key, list] of groups) {
    // Neto del grupo: del total, o de la cuenta filtrada (ahí las transferencias sí cuentan)
    const net = list.reduce((s, t) => s + txDelta(t, acc), 0);
    h += `<div class="list-h"><span>${esc(groupLabel(key))}</span><span class="num">${esc(money(net))}</span></div><div class="list">`;
    h += list.map(t => {
      const when = yearMode ? ' · ' + esc(shortDate(t.date)) : '';
      if (t.type === 'transfer') {
        const f = accOf(t.from), to = accOf(t.to);
        const d = acc ? txDelta(t, acc) : 0;
        return `<button class="item" data-edit="${t.id}">
          <span class="ico">↔️</span>
          <span class="main"><span class="t" style="display:block">${esc(t.note || (t.to === 'efectivo' ? 'Sacar efectivo' : 'Ingresar efectivo'))}</span><span class="s" style="display:block">${f.emoji} ${esc(f.name)} → ${to.emoji} ${esc(to.name)}${when}</span></span>
          <span class="amt ${d > 0 ? 'pos' : 'xfer'}">${d > 0 ? '+' : d < 0 ? '−' : ''}${esc(money(t.amount))}</span>
        </button>`;
      }
      const c = catOf(t.cat), a = accOf(t.acc);
      return `<button class="item" data-edit="${t.id}">
        <span class="ico">${esc(c.emoji)}</span>
        <span class="main"><span class="t" style="display:block">${esc(t.note || t.cat)}${t.rec ? '<span class="badge">↻</span>' : ''}</span><span class="s" style="display:block">${a.emoji} ${esc(t.cat)}${when}</span></span>
        <span class="amt ${t.type === 'ingreso' ? 'pos' : ''}">${t.type === 'ingreso' ? '+' : '−'}${esc(money(t.amount))}</span>
      </button>`;
    }).join('') + `</div>`;
  }
  $('tx-list').innerHTML = h;
}

function recRow(r) {
  const next = nextCharge(r);
  const sameYear = next.slice(0, 4) === today().slice(0, 4);
  const nd = new Date(next + 'T12:00').toLocaleDateString('es', sameYear ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '');
  const when = r.freq === 'year' ? 'Anual' : 'Mensual';
  return `<div class="item" style="${r.active ? '' : 'opacity:.55'}">
    <button class="item-btn" data-rec="${r.id}" aria-label="Editar ${esc(r.note || r.cat)}">
      <span class="ico">${esc(recEmoji(r))}</span>
      <span class="main"><span class="t" style="display:block">${esc(r.note || r.cat)}</span>
      <span class="s" style="display:block">${accOf(r.acc).emoji} ${when} · ${r.active ? 'próximo ' + esc(nd) : 'en pausa'}</span></span>
      <span style="text-align:right"><span class="amt ${r.type === 'ingreso' ? 'pos' : ''}" style="display:block">${r.type === 'ingreso' ? '+' : '−'}${esc(money(r.amount))}</span>
      ${r.freq === 'year' ? `<span class="s num" style="display:block;font-size:12px">${esc(money(recMonthly(r)))}/mes</span>` : ''}</span>
    </button>
    <button class="del" data-delrec="${r.id}" aria-label="Quitar ${esc(r.note || r.cat)}" title="Quitar">✕</button>
  </div>`;
}
function renderRecs() {
  const byDay = (a, b) => nextCharge(a).localeCompare(nextCharge(b));
  const subs = state.recs.filter(isSub).sort(byDay);
  const fixedOut = state.recs.filter(r => !isSub(r) && r.type === 'gasto').sort(byDay);
  const fixedIn = state.recs.filter(r => r.type === 'ingreso').sort(byDay);
  const subMonth = subs.filter(r => r.active).reduce((s, r) => s + recMonthly(r), 0);

  let h = `<div class="card hero">
    <div class="label">Suscripciones activas</div>
    <div class="big num" style="margin-bottom:2px">${esc(money(subMonth))}<span style="font-size:18px;color:var(--text-2);font-weight:600"> /mes</span></div>
    <div class="muted" style="font-size:14px">${esc(money(subMonth * 12))} al año · ${subs.filter(r => r.active).length} activas</div>
    <button class="btn primary block" data-newrec="sub" style="margin-top:14px">+ Agregar suscripción</button>
  </div>`;

  h += `<div class="list-h"><span>Suscripciones</span></div>`;
  h += subs.length ? `<div class="list">${subs.map(recRow).join('')}</div>`
    : `<div class="card empty">Aún no tienes suscripciones. Toca <b>+ Agregar suscripción</b>.</div>`;

  h += `<div class="list-h"><span>Gastos fijos</span><button class="link" style="font-size:14px;padding:0;min-height:0" data-newrec="gasto">+ Agregar</button></div>`;
  h += fixedOut.length ? `<div class="list">${fixedOut.map(recRow).join('')}</div>`
    : `<div class="card empty">Alquiler, seguros, gimnasio… lo que pagas igual cada mes.</div>`;

  h += `<div class="list-h"><span>Ingresos fijos</span><button class="link" style="font-size:14px;padding:0;min-height:0" data-newrec="ingreso">+ Agregar</button></div>`;
  h += fixedIn.length ? `<div class="list">${fixedIn.map(recRow).join('')}</div>`
    : `<div class="card empty">Tu nómina u otros ingresos que llegan cada mes.</div>`;

  h += `<p class="hint" style="margin:12px 4px">Se registran solos en su fecha de cobro. Toca uno para editarlo o pausarlo; ✕ para quitarlo (lo ya registrado se conserva).</p>`;
  $('tx-rec').innerHTML = h;
}

/* =========================================================
   Vista: Metas
   ========================================================= */
function goalBar(g) {
  const pct = g.target ? Math.min(100, g.saved / g.target * 100) : 0;
  let note = '';
  if (g.saved >= g.target) note = '<span class="pos">🎉 ¡Meta cumplida!</span>';
  else if (g.deadline) {
    const months = monthsUntil(g.deadline);
    note = g.deadline < today() ? '<span class="over">Fecha vencida</span>' : `Ahorra ${esc(money((g.target - g.saved) / months))}/mes · ${months} ${months === 1 ? 'mes' : 'meses'}`;
  } else note = `Faltan ${esc(money(g.target - g.saved))}`;
  return `<div class="cat" data-tip="${esc(`<b>${esc(g.name)}</b>${esc(money(g.saved))} de ${esc(money(g.target))}`)}">
    <span class="ico">${esc(g.emoji || '🎯')}</span>
    <div><div class="top"><b>${esc(g.name)}</b><span class="num">${Math.floor(pct)}%</span></div>
    <div class="track"><div class="fill goal" style="width:${pct}%"></div></div></div>
    <div class="meta"><span class="num">${esc(money(g.saved))} de ${esc(money(g.target))}</span><span>${note}</span></div>
  </div>`;
}
function renderGoals() {
  let h = '';
  if (!state.goals.length) {
    h = `<div class="card" style="text-align:center;padding:28px 16px">
      <div style="font-size:40px">🎯</div><h2 style="justify-content:center;margin:8px 0 4px">Crea tu primera meta</h2>
      <p class="muted" style="margin:0 0 14px">Un viaje, un fondo de emergencia, un computador… te digo cuánto ahorrar cada mes para llegar.</p>
      <button class="btn primary" id="first-goal">Nueva meta</button></div>`;
  } else {
    const saved = state.goals.reduce((s, g) => s + g.saved, 0), target = state.goals.reduce((s, g) => s + g.target, 0);
    h += `<div class="card hero"><div class="label">Ahorrado en metas</div><div class="big num" style="margin-bottom:4px">${esc(money(saved))}</div><div class="muted">de ${esc(money(target))} en ${state.goals.length} ${state.goals.length === 1 ? 'meta' : 'metas'}</div></div>`;
    h += state.goals.map(g => `<div class="card">${goalBar(g)}
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn primary" style="flex:1;min-height:42px" data-contrib="${g.id}">+ Aportar</button>
        <button class="btn" style="flex:1;min-height:42px" data-withdraw="${g.id}">− Retirar</button>
        <button class="btn" style="min-height:42px" data-goal="${g.id}" aria-label="Editar meta">✎</button>
      </div></div>`).join('');
  }
  $('v-goals').innerHTML = h;
  const fg = $('first-goal'); if (fg) fg.onclick = () => openGoalSheet();
}
