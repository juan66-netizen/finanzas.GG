/* =========================================================
   Hoja inferior (formularios)
   ========================================================= */
let sheetCleanup = null;
function openSheet(html, mount) {
  const sh = $('sheet');
  $('toast').style.display = 'none';
  sh.innerHTML = `<div class="grabber"></div>` + html;
  $('sheet-wrap').classList.add('open');
  $('sheet-wrap').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  sh.scrollTop = 0;
  sheetCleanup = mount ? mount(sh) : null;
}
function closeSheet() {
  $('sheet-wrap').classList.remove('open');
  $('sheet-wrap').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  document.activeElement && document.activeElement.blur();
  if (typeof sheetCleanup === 'function') sheetCleanup();
  sheetCleanup = null;
}
$('sheet-wrap').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
// Deslizar hacia abajo para cerrar
(() => {
  let y0 = null;
  const sh = $('sheet');
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  sh.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0;
    sh.style.transition = ''; sh.style.transform = '';
    if (dy > 110) closeSheet();
    y0 = null;
  });
})();

function amountField(value) {
  // En euros el símbolo va después del número (9,99 €)
  const after = /^\d/.test(money(1));
  const sym = `<span>${esc(curSymbol())}</span>`;
  const n = +value;
  const shown = value === '' || value == null || !n ? ''
    : zeroDec() || Number.isInteger(n) ? String(Math.round(n)) : n.toFixed(2).replace('.', ',');
  return `<label class="amount">${after ? '' : sym}<input id="s-amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(shown)}" aria-label="Monto">${after ? sym : ''}</label>
    <div class="amount-fmt" id="s-fmt"></div>`;
}
function wireAmount(sh) {
  const inp = sh.querySelector('#s-amount'), fmt = sh.querySelector('#s-fmt');
  const upd = () => {
    const v = parseAmount(inp.value);
    fmt.textContent = v > 0 ? money(v) : '';
    inp.style.width = Math.max(1, inp.value.length) + 0.6 + 'ch';   // crece con el número
  };
  inp.addEventListener('input', upd); upd();
  return inp;
}
function catGrid(type, selected) {
  return state.cats.filter(c => c.type === type).map(c =>
    `<button type="button" data-cat="${esc(c.name)}" aria-pressed="${c.name === selected}"><span class="e">${esc(c.emoji)}</span>${esc(c.name)}</button>`).join('');
}

/* Movimiento: nuevo / editar */
let lastType = 'gasto';
function openTxSheet(tx, preset = {}) {
  const isNew = !tx;
  const t = tx ? { ...tx } : {
    type: preset.type || lastType, amount: '', cat: '', note: '',
    date: curMonth === monthOf(today()) ? today() : curMonth + '-01',
    acc: state.lastAcc || 'tarjeta',
  };
  if (!isAcc(t.acc)) t.acc = state.lastAcc || 'tarjeta';
  t.from = isAcc(t.from) ? t.from : preset.from || 'tarjeta';
  t.to = otherAcc(t.from);
  const firstCat = type => (state.cats.find(c => c.type === type) || {}).name || '';
  if (!t.cat && t.type !== 'transfer') t.cat = firstCat(t.type);
  openSheet(`
    <div class="sheet-head"><button class="link" data-close>Cancelar</button><h3>${isNew ? 'Nuevo movimiento' : 'Editar movimiento'}</h3><span style="width:70px"></span></div>
    ${isNew ? openingRow() : ''}
    <div class="seg" id="s-type">
      <button type="button" data-type="gasto" aria-pressed="${t.type === 'gasto'}">Gasto</button>
      <button type="button" data-type="ingreso" aria-pressed="${t.type === 'ingreso'}">Ingreso</button>
      <button type="button" data-type="transfer" aria-pressed="${t.type === 'transfer'}">↔ Mover</button>
    </div>
    ${amountField(t.amount)}
    <div id="s-normal">
      <div class="field"><label id="s-acc-l"></label>
        <div class="seg acc-seg" id="s-acc">${ACCOUNTS.map(a => `<button type="button" data-acc="${a.id}" aria-pressed="${t.acc === a.id}">${a.emoji} ${esc(a.name)}</button>`).join('')}</div>
      </div>
      <div class="catgrid" id="s-cats">${t.type === 'transfer' ? '' : catGrid(t.type, t.cat)}</div>
    </div>
    <div id="s-xfer">
      <div class="chips" id="s-xpre">
        <button type="button" class="chip" data-xpre="tarjeta">🏧 Sacar efectivo</button>
        <button type="button" class="chip" data-xpre="efectivo">🏦 Ingresar efectivo</button>
      </div>
      <div class="flow"><div class="end" id="s-from"></div><button type="button" class="swap" id="s-swap" aria-label="Invertir dirección">⇄</button><div class="end" id="s-to"></div></div>
      <p class="hint">Mover dinero entre tarjeta y efectivo no cuenta como gasto ni como ingreso: solo cambia dónde está.</p>
    </div>
    <div class="field"><label for="s-note">Nota</label><input id="s-note" maxlength="80" value="${esc(t.note || '')}"></div>
    <div class="field"><label for="s-date">Fecha</label><input type="date" id="s-date" value="${t.date}"></div>
    ${isNew ? `<label class="switch-row" id="s-rec-row"><span>Repetir cada mes<small>Se registrará solo el mismo día cada mes</small></span><input type="checkbox" class="switch" id="s-rec"></label>`
            : t.rec && t.type !== 'transfer' ? `<p class="hint">↻ Creado por un movimiento recurrente. Editarlo aquí solo cambia este mes.</p>` : ''}
    <button class="btn primary block" id="s-save">${isNew ? 'Agregar' : 'Guardar cambios'}</button>
    ${isNew ? '' : `<button class="btn danger block" id="s-del">Eliminar movimiento</button>`}
  `, sh => {
    const amt = wireAmount(sh);
    if (isNew) setTimeout(() => amt.focus(), 50);
    const orow = sh.querySelector('#s-opening');
    if (orow) orow.onclick = () => openOpeningSheet();
    const $s = sel => sh.querySelector(sel);

    // Muestra lo que corresponde a gasto/ingreso o a mover dinero entre cuentas
    const sync = () => {
      const xfer = t.type === 'transfer';
      $s('#s-normal').hidden = xfer;
      $s('#s-xfer').hidden = !xfer;
      if ($s('#s-rec-row')) $s('#s-rec-row').hidden = xfer;
      $s('#s-acc-l').textContent = t.type === 'ingreso' ? '¿Dónde lo recibiste?' : '¿Cómo pagaste?';
      $s('#s-note').placeholder = xfer ? 'Ej: cajero del banco' : t.type === 'ingreso' ? 'Ej: nómina, venta…' : 'Ej: almuerzo, Netflix…';
      const f = accOf(t.from), to = accOf(t.to);
      $s('#s-from').innerHTML = `<small>Desde</small>${f.emoji} ${esc(f.name)}`;
      $s('#s-to').innerHTML = `<small>Hacia</small>${to.emoji} ${esc(to.name)}`;
      sh.querySelectorAll('#s-xpre button').forEach(b => b.setAttribute('aria-pressed', b.dataset.xpre === t.from));
    };
    sync();

    $s('#s-type').onclick = e => {
      const b = e.target.closest('[data-type]');
      if (!b || b.dataset.type === t.type) return;
      t.type = b.dataset.type;
      sh.querySelectorAll('#s-type button').forEach(x => x.setAttribute('aria-pressed', x === b));
      if (t.type !== 'transfer') { t.cat = firstCat(t.type); $s('#s-cats').innerHTML = catGrid(t.type, t.cat); }
      sync();
    };
    $s('#s-acc').onclick = e => {
      const b = e.target.closest('[data-acc]'); if (!b) return;
      t.acc = b.dataset.acc;
      sh.querySelectorAll('#s-acc button').forEach(x => x.setAttribute('aria-pressed', x === b));
    };
    $s('#s-cats').onclick = e => {
      const b = e.target.closest('[data-cat]'); if (!b) return;
      t.cat = b.dataset.cat;
      sh.querySelectorAll('#s-cats button').forEach(x => x.setAttribute('aria-pressed', x === b));
    };
    $s('#s-xpre').onclick = e => {
      const b = e.target.closest('[data-xpre]'); if (!b) return;
      t.from = b.dataset.xpre; t.to = otherAcc(t.from); sync();
    };
    $s('#s-swap').onclick = () => { [t.from, t.to] = [t.to, t.from]; sync(); };

    $s('#s-save').onclick = () => {
      const amount = parseAmount(amt.value);
      if (!(amount > 0)) { amt.focus(); return toast('Escribe un monto'); }
      const date = $s('#s-date').value || today();
      const note = $s('#s-note').value.trim();
      if (t.type === 'transfer') {
        const data = { type: 'transfer', amount, from: t.from, to: t.to, date, note };
        if (isNew) state.txs.push({ id: uid(), ...data });
        else {
          const x = state.txs.find(x => x.id === tx.id);
          Object.assign(x, data);
          delete x.cat; delete x.acc; delete x.rec;
        }
        toast(isNew ? (t.to === 'efectivo' ? 'Retiro de efectivo registrado' : 'Ingreso de efectivo registrado') : 'Cambios guardados');
      } else {
        if (!t.cat) return toast('Elige una categoría');
        const data = { type: t.type, amount, cat: t.cat, date, note, acc: t.acc };
        state.lastAcc = t.acc;
        if (isNew) {
          const nt = { id: uid(), ...data };
          if ($s('#s-rec').checked) {
            const r = { id: uid(), type: t.type, amount, cat: t.cat, note, acc: t.acc, day: +date.slice(8), start: monthOf(date), last: monthOf(date), active: true };
            state.recs.push(r); nt.rec = r.id;
          }
          state.txs.push(nt);
          lastType = t.type;
          const added = applyRecurring();
          toast((t.type === 'gasto' ? 'Gasto registrado' : 'Ingreso registrado') + (added ? ` · +${added} recurrentes` : ''));
        } else {
          const x = state.txs.find(x => x.id === tx.id);
          Object.assign(x, data);
          delete x.from; delete x.to;
          toast('Cambios guardados');
        }
      }
      save();
      if (monthOf(date) !== curMonth) curMonth = monthOf(date);
      closeSheet(); render();
    };
    const del = $s('#s-del');
    if (del) del.onclick = () => {
      const old = state.txs.find(x => x.id === tx.id);
      state.txs = state.txs.filter(x => x.id !== tx.id);
      save(); closeSheet(); render();
      toast('Movimiento eliminado', () => { state.txs.push(old); save(); render(); });
    };
  });
}

/* Suscripciones y fijos: crear / editar
   kind (solo al crear): 'sub' | 'gasto' | 'ingreso' */
const SUB_PRESETS = [
  ['Netflix', '🎬'], ['Spotify', '🎵'], ['Disney+', '✨'], ['Prime Video', '📦'], ['HBO Max', '🎞️'],
  ['YouTube Premium', '▶️'], ['Apple Music', '🎧'], ['iCloud+', '☁️'], ['ChatGPT', '🤖'],
  ['Gimnasio', '🏋️'], ['PlayStation Plus', '🎮'], ['Móvil', '📱'], ['Internet', '🌐'], ['Periódico', '📰'],
];
function openRecSheet(rec, kind) {
  const isNew = !rec;
  const r = rec ? { ...rec, freq: rec.freq || 'month' } : {
    type: kind === 'ingreso' ? 'ingreso' : 'gasto',
    cat: kind === 'sub' ? 'Suscripciones' : (state.cats.find(c => c.type === (kind === 'ingreso' ? 'ingreso' : 'gasto') && c.name !== 'Suscripciones') || {}).name || '',
    note: '', amount: '', freq: 'month', emoji: '', active: true, acc: 'tarjeta',
  };
  const sub = isSub(r);
  const title = isNew ? (sub ? 'Nueva suscripción' : kind === 'ingreso' ? 'Nuevo ingreso fijo' : 'Nuevo gasto fijo')
    : (sub ? 'Suscripción' : r.type === 'ingreso' ? 'Ingreso fijo' : 'Gasto fijo');
  const dateVal = isNew ? today() : nextCharge(r);
  openSheet(`
    <div class="sheet-head"><button class="link" data-close>Cancelar</button><h3>${title}</h3><span style="width:70px"></span></div>
    ${sub ? `<div class="field"><label>Elige una o escribe el nombre</label><div class="chips" id="s-presets">${SUB_PRESETS.map(([n, e]) =>
        `<button type="button" class="chip" data-preset="${esc(n)}" data-e="${e}" aria-pressed="${r.note === n}">${e} ${esc(n)}</button>`).join('')}</div></div>` : ''}
    <div class="field"><label for="s-note">Nombre</label><input id="s-note" maxlength="60" value="${esc(r.note || '')}" placeholder="${sub ? 'Ej: Netflix' : r.type === 'ingreso' ? 'Ej: Nómina' : 'Ej: Alquiler'}"></div>
    ${amountField(r.amount)}
    <div class="seg" id="s-freq"><button type="button" data-freq="month" aria-pressed="${r.freq !== 'year'}">Mensual</button><button type="button" data-freq="year" aria-pressed="${r.freq === 'year'}">Anual</button></div>
    <div class="field"><label>${r.type === 'ingreso' ? '¿Dónde lo recibes?' : '¿Cómo se paga?'}</label>
      <div class="seg acc-seg" id="s-acc">${ACCOUNTS.map(a => `<button type="button" data-acc="${a.id}" aria-pressed="${(r.acc || 'tarjeta') === a.id}">${a.emoji} ${esc(a.name)}</button>`).join('')}</div></div>
    ${sub ? '' : `<div class="catgrid" id="s-cats">${catGrid(r.type, r.cat)}</div>`}
    <div class="field"><label for="s-date">Próximo cobro</label><input type="date" id="s-date" value="${dateVal}"></div>
    ${isNew ? `<p class="hint">Si la fecha es hoy o ya pasó, el cobro se registra de inmediato.</p>`
      : `<label class="switch-row"><span>Activa<small>Pausa sin borrarla</small></span><input type="checkbox" class="switch" id="s-active" ${r.active ? 'checked' : ''}></label>
         <p class="hint">Los cambios aplican a los próximos cobros; lo ya registrado no cambia.</p>`}
    <button class="btn primary block" id="s-save">${isNew ? 'Agregar' : 'Guardar cambios'}</button>
    ${isNew ? '' : `<button class="btn danger block" id="s-del">Quitar ${sub ? 'suscripción' : 'este fijo'}</button>`}
  `, sh => {
    const amt = wireAmount(sh);
    const noteInp = sh.querySelector('#s-note');
    const presets = sh.querySelector('#s-presets');
    if (presets) presets.onclick = e => {
      const b = e.target.closest('[data-preset]'); if (!b) return;
      noteInp.value = b.dataset.preset; r.emoji = b.dataset.e;
      presets.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      amt.focus();
    };
    noteInp.addEventListener('input', () => {
      const p = SUB_PRESETS.find(([n]) => n.toLowerCase() === noteInp.value.trim().toLowerCase());
      r.emoji = p ? p[1] : (sub ? '' : r.emoji);
      if (presets) presets.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', !!p && x.dataset.preset === p[0]));
    });
    sh.querySelector('#s-freq').onclick = e => {
      const b = e.target.closest('[data-freq]'); if (!b) return;
      r.freq = b.dataset.freq;
      sh.querySelectorAll('#s-freq button').forEach(x => x.setAttribute('aria-pressed', x === b));
    };
    sh.querySelector('#s-acc').onclick = e => {
      const b = e.target.closest('[data-acc]'); if (!b) return;
      r.acc = b.dataset.acc;
      sh.querySelectorAll('#s-acc button').forEach(x => x.setAttribute('aria-pressed', x === b));
    };
    const cats = sh.querySelector('#s-cats');
    if (cats) cats.onclick = e => {
      const b = e.target.closest('[data-cat]'); if (!b) return;
      r.cat = b.dataset.cat;
      cats.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    };
    if (isNew && sub) setTimeout(() => noteInp.focus(), 50);
    sh.querySelector('#s-save').onclick = () => {
      const amount = parseAmount(amt.value);
      const note = noteInp.value.trim();
      const date = sh.querySelector('#s-date').value;
      if (!note) { noteInp.focus(); return toast('Ponle un nombre'); }
      if (!(amount > 0)) { amt.focus(); return toast('Escribe el monto'); }
      if (!date) return toast('Elige la fecha del próximo cobro');
      if (!r.cat) return toast('Elige una categoría');
      if (isNew) {
        const nr = { id: uid(), type: r.type, amount, cat: r.cat, note, emoji: r.emoji || '', freq: r.freq, active: true, acc: r.acc || 'tarjeta' };
        setNextCharge(nr, date);
        state.recs.push(nr);
        const n = applyRecurring();
        save(); closeSheet(); render();
        toast(`${sub ? 'Suscripción agregada' : 'Fijo agregado'}${n ? ' · cobro registrado' : ''}`);
        return;
      }
      const t = state.recs.find(x => x.id === rec.id);
      const active = sh.querySelector('#s-active').checked;
      const freqChanged = (t.freq || 'month') !== r.freq;
      Object.assign(t, { amount, cat: r.cat, note, emoji: r.emoji || '', freq: r.freq, active, acc: r.acc || 'tarjeta' });
      if (date !== dateVal || freqChanged) setNextCharge(t, date);
      else if (active && !rec.active) {
        // Al reactivar no se cobran los meses en pausa: salta al próximo cobro desde hoy
        const curYm = monthOf(today());
        let ym = nextChargeMonth(t);
        while (ym < curYm) ym = shiftMonth(ym, recStep(t));
        t.last = shiftMonth(ym, -recStep(t));
      }
      applyRecurring(); save(); closeSheet(); render(); toast('Cambios guardados');
    };
    const del = sh.querySelector('#s-del');
    if (del) del.onclick = () => { closeSheet(); removeRec(rec.id); };
  });
}
function removeRec(id) {
  const i = state.recs.findIndex(x => x.id === id);
  if (i < 0) return;
  const [old] = state.recs.splice(i, 1);
  save(); render();
  toast(`Se quitó «${old.note || old.cat}»`, () => { state.recs.splice(i, 0, old); save(); render(); });
}

// Saldo inicial de cada cuenta (tarjeta y efectivo) en una misma fecha de inicio
function openOpeningSheet() {
  const o = state.opening;
  const sign = Object.fromEntries(ACCOUNTS.map(a => [a.id, o && openingOf(a.id) < 0 ? -1 : 1]));
  const after = /^\d/.test(money(1));
  const sym = `<span class="cur">${esc(curSymbol())}</span>`;
  const shown = n => !n ? '' : zeroDec() || Number.isInteger(n) ? String(Math.abs(Math.round(n))) : Math.abs(n).toFixed(2).replace('.', ',');
  openSheet(`
    <div class="sheet-head"><button class="link" data-close>Cancelar</button><h3>Saldos iniciales</h3><span style="width:70px"></span></div>
    <p class="hint" style="margin:0 4px 12px">Cuánto dinero tenías en cada sitio en la fecha que elijas. Desde ahí la app suma tus ingresos y resta tus gastos de cada uno para mostrarte cuánto te queda.</p>
    <div class="field"><label for="o-date">Fecha de esos saldos</label><input type="date" id="o-date" value="${o ? o.date : today()}"></div>
    ${ACCOUNTS.map(a => `<div class="o-acc">
      <span class="h">${a.emoji} ${esc(a.name)}</span>
      <span class="o-in">
        <button type="button" class="sign ${sign[a.id] < 0 ? 'neg' : ''}" data-sign="${a.id}" aria-label="Cambiar signo de ${esc(a.name)}">${sign[a.id] < 0 ? '−' : '+'}</button>
        ${after ? '' : sym}<input class="inp" inputmode="decimal" autocomplete="off" id="o-${a.id}" placeholder="0" value="${o ? shown(openingOf(a.id)) : ''}" aria-label="Saldo inicial de ${esc(a.name)}">${after ? sym : ''}
      </span>
    </div>`).join('')}
    <p class="hint" style="margin:-2px 4px 12px">Toca <b>+</b> para ponerlo en negativo si la tarjeta estaba en descubierto.</p>
    <div class="card" style="background:var(--surface-2);margin:0;padding:12px 14px">
      <div class="w-row" style="margin:0"><span>Saldo disponible hoy</span><b id="o-prev">—</b></div>
      <div class="w-row" style="margin:4px 0 0" id="o-split"></div>
      <div class="muted" style="font-size:12px;margin-top:6px" id="o-note"></div>
    </div>
    <button class="btn primary block" id="o-save">Guardar saldos iniciales</button>
    ${o ? `<button class="btn danger block" id="o-del">Quitar saldos iniciales</button>` : ''}
  `, sh => {
    const dateInp = sh.querySelector('#o-date');
    const inputs = Object.fromEntries(ACCOUNTS.map(a => [a.id, sh.querySelector(`#o-${a.id}`)]));
    if (!o) setTimeout(() => inputs.tarjeta.focus(), 50);
    const read = () => {
      const amounts = {};
      for (const a of ACCOUNTS) {
        const v = parseAmount(inputs[a.id].value || '0');
        if (!Number.isFinite(v) || v < 0) return null;
        amounts[a.id] = sign[a.id] * v;
      }
      return { date: dateInp.value || today(), amounts };
    };
    // Vista previa: cómo quedarían los saldos de hoy con estos saldos iniciales
    const preview = () => {
      const r = read(), now = today();
      const prev = sh.querySelector('#o-prev'), split = sh.querySelector('#o-split'), note = sh.querySelector('#o-note');
      if (!r || r.date > now) {
        prev.textContent = '—'; split.innerHTML = '';
        note.textContent = !r ? 'Revisa los montos.' : 'La fecha es futura: los saldos empezarán a contar ese día.';
        return;
      }
      const after = state.txs.filter(t => t.date >= r.date && t.date <= now);
      const bal = acc => (acc ? r.amounts[acc] : Object.values(r.amounts).reduce((s, v) => s + v, 0)) + after.reduce((s, t) => s + txDelta(t, acc), 0);
      prev.textContent = money(bal());
      prev.className = bal() < 0 ? 'neg' : '';
      split.innerHTML = ACCOUNTS.map(a => `<span>${a.emoji} ${esc(a.name)} <b class="${bal(a.id) < 0 ? 'neg' : ''}">${esc(money(bal(a.id)))}</b></span>`).join('');
      const before = state.txs.filter(t => t.date < r.date).length;
      note.textContent = `Se ${after.length === 1 ? 'suma 1 movimiento' : `suman ${after.length} movimientos`} desde esa fecha.` +
        (before ? ` Los ${before} anteriores no cuentan (ya están dentro de estos saldos).` : '');
    };
    Object.values(inputs).forEach(el => el.addEventListener('input', preview));
    dateInp.addEventListener('input', preview);
    sh.querySelectorAll('[data-sign]').forEach(b => b.onclick = () => {
      const id = b.dataset.sign;
      sign[id] = -sign[id];
      b.textContent = sign[id] < 0 ? '−' : '+';
      b.classList.toggle('neg', sign[id] < 0);
      preview();
    });
    preview();
    sh.querySelector('#o-save').onclick = () => {
      const r = read();
      if (!r) return toast('Escribe montos válidos');
      state.opening = r;
      save(); closeSheet(); render();
      toast('Saldos iniciales guardados');
    };
    const del = sh.querySelector('#o-del');
    if (del) del.onclick = () => {
      const old = state.opening;
      state.opening = null;
      save(); closeSheet(); render();
      toast('Saldos iniciales quitados', () => { state.opening = old; save(); render(); });
    };
  });
}

/* =========================================================
   PIN y bloqueo
   ========================================================= */
let lockCtx = null;
let failCount = 0, lockedUntil = 0, pinBusy = false;

function openLock(mode, opts = {}) {
  lockCtx = { mode, entry: '', first: null, ...opts };
  $('lock').hidden = false;
  lockText();
  drawDots();
}
function closeLock() { $('lock').hidden = true; lockCtx = null; }
function lockText(err) {
  const m = lockCtx.mode;
  $('lock-title').textContent = m === 'unlock' ? 'Ingresa tu PIN'
    : m === 'verify' ? 'Ingresa tu PIN actual'
    : lockCtx.first ? 'Confirma tu nuevo PIN' : 'Crea un PIN de 6 dígitos';
  const sub = $('lock-sub');
  sub.className = err ? 'err' : '';
  sub.textContent = err || (m === 'set' && !lockCtx.first ? 'Lo pediremos cada vez que abras la app' : '');
  $('lock-alt').textContent = m === 'unlock' ? '¿Olvidaste?' : 'Cancelar';
}
function drawDots() {
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < lockCtx.entry.length));
}
function shake(msg) {
  const d = $('dots');
  d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  if (navigator.vibrate) navigator.vibrate(120);
  lockCtx.entry = ''; drawDots(); lockText(msg);
}
function lockKey(k) {
  if (!lockCtx || pinBusy) return;
  if (Date.now() < lockedUntil) return;
  if (k === 'del') lockCtx.entry = lockCtx.entry.slice(0, -1);
  else if (lockCtx.entry.length < 6) lockCtx.entry += k;
  drawDots();
  if (lockCtx.entry.length === 6) submitPin();
}
async function checkPin(pin) {
  const env = readEnv();
  const key = await deriveKey(pin, unb64(env.salt), env.iter);
  const data = await decryptEnv(key, env);   // falla si el PIN es incorrecto
  return { key, data, env };
}
function registerFail() {
  failCount++;
  if (failCount >= 5) {
    lockedUntil = Date.now() + 30000;
    const kp = $('keypad');
    kp.querySelectorAll('button').forEach(b => b.disabled = true);
    const tick = () => {
      const s = Math.ceil((lockedUntil - Date.now()) / 1000);
      if (s > 0) { lockText(`Demasiados intentos. Espera ${s} s`); setTimeout(tick, 500); }
      else { kp.querySelectorAll('button').forEach(b => b.disabled = false); failCount = 0; lockText(); }
    };
    tick();
  } else shake(`PIN incorrecto · ${5 - failCount} ${5 - failCount === 1 ? 'intento' : 'intentos'} antes de esperar`);
}
async function submitPin() {
  const pin = lockCtx.entry;
  const mode = lockCtx.mode;
  pinBusy = true;
  try {
    if (mode === 'unlock') {
      $('lock-sub').className = ''; $('lock-sub').textContent = 'Abriendo…';
      try {
        const { key, data, env } = await checkPin(pin);
        cryptoKey = key; kdf = { salt: unb64(env.salt), iter: env.iter };
        state = normalize(data); failCount = 0;
        closeLock(); boot();
      } catch { registerFail(); }
    } else if (mode === 'verify') {
      try { await checkPin(pin); failCount = 0; const done = lockCtx.onDone; closeLock(); done(); }
      catch { registerFail(); }
    } else if (mode === 'set') {
      if (!lockCtx.first) { lockCtx.first = pin; lockCtx.entry = ''; drawDots(); lockText(); }
      else if (pin === lockCtx.first) {
        $('lock-sub').textContent = 'Cifrando…';
        const salt = crypto.getRandomValues(new Uint8Array(16));
        cryptoKey = await deriveKey(pin, salt, PBKDF2_ITER);
        kdf = { salt, iter: PBKDF2_ITER };
        await save();
        closeLock(); render(); toast('PIN activado · datos cifrados');
      } else { lockCtx.first = null; shake('Los PIN no coinciden. Intenta de nuevo'); }
    }
  } finally { pinBusy = false; }
}
$('keypad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'lock-alt') {
    if (lockCtx.mode === 'unlock') {
      if (confirm('Sin el PIN no es posible leer tus datos.\n\n¿Borrar todo y empezar de cero? (Luego puedes restaurar un respaldo.)')) {
        localStorage.removeItem(STORE); location.reload();
      }
    } else closeLock();
    return;
  }
  lockKey(b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (lockCtx) {
    if (/^\d$/.test(e.key)) lockKey(e.key);
    else if (e.key === 'Backspace') lockKey('del');
    else if (e.key === 'Escape' && lockCtx.mode !== 'unlock') closeLock();
    return;
  }
  if (e.key === 'Escape' && $('sheet-wrap').classList.contains('open')) closeSheet();
});

// Auto-bloqueo: al volver tras más de 1 minuto se recarga y pide el PIN
// Al volver tras un rato fuera se recarga: así toma la versión nueva de la app.
// Los datos ya están guardados (se guardan en cada cambio), así que no se pierde nada.
const REFRESH_MS = 10 * 60 * 1000;
let hiddenAt = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.hidden) {
    hiddenAt = Date.now();
    if (cryptoKey) $('veil').classList.add('on');
    return;
  }
  const away = Date.now() - hiddenAt;
  if (hiddenAt && (away > REFRESH_MS || (cryptoKey && away > AUTOLOCK_MS))) {
    await saveChain;
    state = null; cryptoKey = null;
    location.reload();
    return;
  }
  $('veil').classList.remove('on');
});

  const d = el.dataset;
  if (d.xfer) return openTxSheet(null, { type: 'transfer', from: d.xfer });
  if (d.customize !== undefined) return openWidgetsSheet();
  if (d.opening !== undefined) return openOpeningSheet();
  if (d.newrec) return openRecSheet(null, d.newrec);
  if (d.delrec) {
    const r = state.recs.find(x => x.id === d.delrec);
    if (r && confirm(`¿Quitar «${r.note || r.cat}»? Dejará de registrarse; lo ya cobrado se conserva.`)) removeRec(r.id);
    return;
  }
  if (d.month) {   // desde el resumen anual, abrir ese mes
    curMonth = d.month; period = 'month';
    try { localStorage.setItem(STORE + '-period', period); } catch {}
    window.scrollTo(0, 0); return render();
  }
  if (d.edit) return openTxSheet(state.txs.find(t => t.id === d.edit));
  if (d.rec) return openRecSheet(state.recs.find(r => r.id === d.rec));
  if (d.goal) return openGoalSheet(state.goals.find(g => g.id === d.goal));
  if (d.contrib) return openContribSheet(state.goals.find(g => g.id === d.contrib), 1);
  if (d.withdraw) return openContribSheet(state.goals.find(g => g.id === d.withdraw), -1);
  if (d.goto) { if (d.goto === 'rec') { txMode = 'rec'; return setTab('tx'); } return setTab(d.goto); }
  if (d.delcat !== undefined) {
    const c = state.cats[+d.delcat];
    const used = state.txs.filter(t => t.cat === c.name).length;
    if (!confirm(used ? `"${c.name}" tiene ${used} movimiento(s). Se conservan, pero la categoría sale de la lista. ¿Eliminar?` : `¿Eliminar "${c.name}"?`)) return;
    state.cats.splice(+d.delcat, 1); save(); render(); return;
  }
  switch (el.id) {
    case 'pin-on': return openLock('set');
    case 'pin-change': return openLock('verify', { onDone: () => openLock('set') });
    case 'pin-off': return openLock('verify', { onDone: async () => { cryptoKey = null; kdf = null; await save(); render(); toast('PIN desactivado'); } });
    case 'add-cat': return openCatSheet();
    case 'open-theme': return openThemeSheet();
    case 'open-opening': return openOpeningSheet();
    case 'open-widgets': return openWidgetsSheet();
    case 'exp-json': return openBackupSheet();
    case 'snooze-backup': backupSnoozed = true; return render();
    case 'imp-open': return openRestoreSheet();
    case 'exp-csv': return exportCsv();
    case 'demo': return loadDemo();
    case 'wipe':
      if (!confirm('¿Borrar TODOS tus movimientos, metas y ajustes? Esto no se puede deshacer.')) return;
      if (!confirm('¿Seguro? Te recomiendo guardar un respaldo antes.')) return;
      try { localStorage.removeItem(STORE); } catch {}
      location.reload();
  }
});
document.querySelector('main').addEventListener('change', async e => {
  if (e.target.id === 'currency') { state.currency = e.target.value; save(); render(); return; }
  if (e.target.dataset.budget !== undefined) {
    const v = parseAmount(e.target.value);
    state.cats[+e.target.dataset.budget].budget = v > 0 ? v : 0;
    save(); render(); return;
  }
});

/* Tooltip: hover en computador, toque en iPhone */
const tip = $('tip');
let tipTimer;
function showTip(el, x, y) {
  tip.innerHTML = el.dataset.tip;
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  let tx = x + 14, ty = y - r.height - 14;
  if (tx + r.width > innerWidth - 8) tx = x - r.width - 14;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = y + 18;
  tip.style.left = tx + 'px'; tip.style.top = ty + 'px';
  document.querySelectorAll('svg .on').forEach(h => h.classList.remove('on'));
  if (el.closest('svg')) el.classList.add('on');   // resalta la barra o el punto del gráfico
}
function hideTip() { tip.style.display = 'none'; document.querySelectorAll('svg .on').forEach(h => h.classList.remove('on')); }
document.addEventListener('mousemove', e => {
  if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
  const el = e.target.closest('[data-tip]');
  el ? showTip(el, e.clientX, e.clientY) : hideTip();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) return;
  showTip(el, e.clientX, e.clientY);
  clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 2500);
});
addEventListener('scroll', hideTip, { passive: true });

/* Toast */
let toastTimer;
function toast(msg, undo) {
  const t = $('toast');
  t.innerHTML = esc(msg) + (undo ? '<button id="undo">Deshacer</button>' : '');
  t.style.display = 'block';
  if (undo) $('undo').onclick = () => { undo(); t.style.display = 'none'; };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', undo ? 5000 : 2500);
}

/* Exportar: en iPhone abre el menú Compartir (Guardar en Archivos, AirDrop…)
   Devuelve 'shared' | 'downloaded' | 'cancelled' */
async function shareFile(name, text, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return 'shared'; }
    catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  return 'downloaded';
}

/* Respaldo guiado */
function backupDays() {
  if (!state.lastBackup) return null;
  return Math.round((new Date(today() + 'T12:00') - new Date(state.lastBackup + 'T12:00')) / 86400000);
}
function backupAge() {
  const d = backupDays();
  return d === null ? 'Nunca' : d === 0 ? 'Hoy' : d === 1 ? 'Ayer' : `Hace ${d} días`;
}
const stepsHtml = steps => `<ol style="margin:0 0 14px;padding-left:22px;color:var(--text-2);line-height:1.6">${steps.map(s => `<li style="margin-bottom:6px">${s}</li>`).join('')}</ol>`;

function openBackupSheet() {
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const name = `Mis-Finanzas-respaldo-${today()}.json`;
  openSheet(`
    <div class="sheet-head"><button class="link" data-close>Cerrar</button><h3>Guardar respaldo</h3><span style="width:60px"></span></div>
    <div style="text-align:center;font-size:44px;margin:4px 0 6px">💾</div>
    <p style="margin:0 0 16px;color:var(--text-2);text-align:center">Es una copia de todos tus datos en un archivo. Tus datos <b>ya se guardan solos</b> en la app; esto es por si algún día la borras o cambias de teléfono.</p>
    <div class="card" style="background:var(--surface-2);margin-bottom:12px">
      <b style="display:block;margin-bottom:8px">Cómo guardarlo${isIOS ? ' en iCloud' : ''}:</b>
      ${stepsHtml(isIOS ? [
        'Toca <b>Guardar archivo</b> aquí abajo.',
        'En el menú que aparece, baja y elige <b>Guardar en Archivos</b>.',
        'Elige <b>iCloud Drive</b> (puedes crear una carpeta “Mis Finanzas”) y toca <b>Guardar</b>.',
      ] : [
        'Toca <b>Guardar archivo</b>: se descargará a tu carpeta de Descargas.',
        'Muévelo a una carpeta segura (por ejemplo, OneDrive o iCloud).',
      ])}
      <span class="muted" style="font-size:13px">No tienes que abrir el archivo ni hacer nada más con él. Solo lo usarás si necesitas <b>Restaurar respaldo</b>.</span>
    </div>
    <p class="hint" style="text-align:center">Último respaldo: <b>${esc(backupAge())}</b> · Recomendado: una vez al mes</p>
    <button class="btn primary block" id="b-go">Guardar archivo</button>
  `, sh => {
    sh.querySelector('#b-go').onclick = async () => {
      const res = await shareFile(name, JSON.stringify({ ...state, prefs }, null, 2), 'application/json');
      if (res === 'cancelled') return toast('No se guardó el respaldo');
      state.lastBackup = today(); save(); render();
      sh.innerHTML = `<div class="grabber"></div>
        <div style="text-align:center;padding:16px 4px 8px">
          <div style="font-size:48px">✅</div>
          <h3 style="margin:8px 0 6px;font-size:20px">Respaldo listo</h3>
          <p style="color:var(--text-2);margin:0 0 16px">${res === 'shared' ? 'Si lo guardaste en Archivos, ya está a salvo.' : 'El archivo quedó en Descargas.'} Se llama:<br><b style="word-break:break-all">${esc(name)}</b></p>
          <p class="hint" style="text-align:left">Para recuperarlo algún día: <b>Ajustes → Restaurar respaldo</b> y eliges este archivo.</p>
          <button class="btn primary block" data-close>Entendido</button>
        </div>`;
    };
  });
}

function openRestoreSheet() {
  openSheet(`
    <div class="sheet-head"><button class="link" data-close>Cancelar</button><h3>Restaurar respaldo</h3><span style="width:70px"></span></div>
    <div style="text-align:center;font-size:44px;margin:4px 0 6px">♻️</div>
    <div class="card" style="background:var(--surface-2);margin-bottom:12px">
      ${stepsHtml([
        'Toca <b>Elegir archivo</b>.',
        'Busca el archivo <b>Mis-Finanzas-respaldo-…json</b> (o finanzas-respaldo-…) en iCloud Drive o donde lo guardaste.',
        'Confirma y listo: tus datos vuelven a la app.',
      ])}
      <span class="muted" style="font-size:13px">⚠ Reemplaza lo que hay ahora en la app por lo del respaldo.</span>
    </div>
    <label class="btn primary block" style="display:grid;place-items:center;cursor:pointer">Elegir archivo<input type="file" id="r-file" accept=".json,application/json" hidden></label>
  `, sh => {
    sh.querySelector('#r-file').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const s = JSON.parse(await f.text());
        if (!Array.isArray(s.txs)) throw 0;
        const info = `${s.txs.length} movimientos, ${(s.recs || []).length} suscripciones/fijos y ${(s.goals || []).length} metas`;
        if (!confirm(`Este respaldo tiene ${info}.\n\n¿Reemplazar los datos actuales por estos?`)) { e.target.value = ''; return; }
        state = normalize(s); applyRecurring(); await save();
        if (s.prefs) { prefs = normalizePrefs(s.prefs); savePrefs(); applyPrefs(); }
        closeSheet(); setTab('home'); toast('Respaldo restaurado');
      } catch { toast('Ese archivo no es un respaldo de Mis Finanzas'); e.target.value = ''; }
    };
  });
}
function exportCsv() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = ['fecha,tipo,categoria,cuenta,monto,nota', ...[...state.txs].sort((a, b) => a.date.localeCompare(b.date))
    .map(t => t.type === 'transfer'
      ? [t.date, 'movimiento entre cuentas', '', q(`${accOf(t.from).name} → ${accOf(t.to).name}`), t.amount, q(t.note)].join(',')
      : [t.date, t.type, q(t.cat), q(accOf(t.acc).name), t.amount, q(t.note)].join(','))];
  shareFile(`finanzas-${today()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}

function loadDemo() {
  if (state.txs.length && !confirm('Se añadirán movimientos de ejemplo a tus datos. ¿Continuar?')) return;
  const base = monthOf(today());
  const k = state.currency === 'COP' ? 1000 : state.currency === 'CLP' ? 900 : 1;
  const rnd = (a, b) => { const v = (a + Math.random() * (b - a)) * k; return k > 1 ? Math.round(v / 100) * 100 : Math.round(v * 100) / 100; };
  const d = +today().slice(8);
  const fx = v => k > 1 ? Math.round(v * k / 100) * 100 : v;
  for (let i = -5; i <= 0; i++) {
    const m = shiftMonth(base, i);
    const add = (type, cat, amount, day, note, acc = 'tarjeta') => { if (i === 0 && day > d) return; state.txs.push({ id: uid(), type, cat, amount, date: `${m}-${pad(day)}`, note, acc }); };
    if (!(i === 0 && 3 > d)) state.txs.push({ id: uid(), type: 'transfer', amount: fx(150), from: 'tarjeta', to: 'efectivo', date: `${m}-03`, note: 'Cajero' });
    if (Math.random() > .4) add('ingreso', 'Freelance', rnd(300, 900), 15, 'Proyecto');
    add('gasto', 'Servicios', rnd(150, 220), 5, 'Luz, agua e internet');
    for (let j = 0; j < 6; j++) add('gasto', 'Comida', rnd(j % 2 ? 40 : 15, j % 2 ? 120 : 35), 2 + j * 4, j % 2 ? 'Mercado' : 'Café y almuerzo', j % 2 ? 'tarjeta' : 'efectivo');
    add('gasto', 'Transporte', rnd(30, 60), 10, 'Bus y metro', 'efectivo');
    add('gasto', 'Ocio', rnd(80, 260), 20, 'Salidas', Math.random() > .5 ? 'efectivo' : 'tarjeta');
    if (Math.random() > .5) add('gasto', 'Compras', rnd(100, 400), 24, 'Ropa');
  }
  const start = shiftMonth(base, -5);
  const monthly = (type, amount, cat, note, day, emoji = '') =>
    ({ id: uid(), type, amount, cat, note, emoji, day, freq: 'month', start, last: shiftMonth(start, -1), active: true, acc: 'tarjeta' });
  const primeStart = shiftMonth(base, -2);
  state.recs.push(
    monthly('ingreso', fx(2400), 'Salario', 'Nómina', 1),
    monthly('gasto', fx(850), 'Vivienda', 'Alquiler', 2),
    monthly('gasto', fx(12.99), 'Suscripciones', 'Netflix', 12, '🎬'),
    monthly('gasto', fx(10.99), 'Suscripciones', 'Spotify', 20, '🎵'),
    monthly('gasto', fx(2.99), 'Suscripciones', 'iCloud+', 5, '☁️'),
    { id: uid(), type: 'gasto', amount: fx(49.9), cat: 'Suscripciones', note: 'Prime Video', emoji: '📦', day: 8, freq: 'year', start: primeStart, last: shiftMonth(primeStart, -12), active: true },
  );
  state.goals.push(
    { id: uid(), name: 'Fondo de emergencia', emoji: '🛟', target: 6000 * k, saved: 2100 * k, deadline: `${shiftMonth(base, 10)}-01`, history: [] },
    { id: uid(), name: 'Viaje', emoji: '✈️', target: 1500 * k, saved: 600 * k, deadline: `${shiftMonth(base, 6)}-15`, history: [] },
  );
  const setB = (n, v) => { const c = state.cats.find(c => c.name === n); if (c) c.budget = v * k; };
  setB('Comida', 450); setB('Transporte', 150); setB('Vivienda', 850); setB('Servicios', 180); setB('Ocio', 180); setB('Compras', 200); setB('Suscripciones', 35);
  applyRecurring(); save(); setTab('home'); toast('Datos de ejemplo cargados');
}

/* =========================================================
   Arranque
   ========================================================= */
function boot() {
  const n = applyRecurring();
  $('app').hidden = false;
  setTab(tab);
  if (n) toast(`Se registraron ${n} movimiento${n === 1 ? '' : 's'} recurrente${n === 1 ? '' : 's'}`);
}

(function start() {
  applyPrefs();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  const env = readEnv();
  if (!env) {
    // Primera vez, o migración desde la versión anterior
    let old = null;
    try { old = JSON.parse(localStorage.getItem(OLD_STORE)); } catch {}
    state = normalize(old);
    save().then(() => { try { localStorage.removeItem(OLD_STORE); localStorage.removeItem(OLD_STORE + '-theme'); localStorage.removeItem(OLD_STORE + '-hint'); } catch {} });
    return boot();
  }
  if (env.enc) {
    if (!(window.crypto && crypto.subtle)) {
      document.body.innerHTML = '<p style="padding:24px">Tus datos están cifrados. Abre la app desde su dirección https para desbloquearla.</p>';
      return;
    }
    return openLock('unlock');
  }
  try { state = normalize(JSON.parse(env.json)); } catch { state = normalize(null); }
  boot();
})();
</script>
